name: ceiling-dedup

on:
  push:
    paths:
      - 'tools/ceiling-dedup/**'
      - 'docs/witness/pitch-ceiling/pitchtracker_ac_ceiling_dedup.dsp'
      - 'effects/pitchtracker-src/pitchtracker_ac.dsp'
      - '.github/workflows/ceiling-dedup.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-dedup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FAUST_VERSION: "2.85.9"
      FAUST_LIBRARIES_SHA: "78a72d4998dec43e20492ef9b78d1a785b3dc864"
      GAIN: "0.00707945784384138"
      BASELINE_TRACKER_SHA: "3f0184ab36e8bb243fdaa9a325736175b1a64f54dbd93719baa658af2cb6bef3"
    steps:
      - uses: actions/checkout@v4

      - name: Check the baseline anchor
        id: anchor
        run: |
          set -e
          LIVE=$(sha256sum effects/pitchtracker-src/pitchtracker_ac.dsp | cut -d' ' -f1)
          echo "live tracker   $LIVE"
          echo "recorded base  $BASELINE_TRACKER_SHA"
          if [ "$LIVE" = "$BASELINE_TRACKER_SHA" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::STALE BASELINE: the committed baseline renders are anchored to $BASELINE_TRACKER_SHA, live tracker is $LIVE. No verdict is issued."
          fi

      - name: Record a stale baseline instead of a verdict
        if: steps.anchor.outputs.stale == 'true'
        run: |
          set -e
          LIVE=$(sha256sum effects/pitchtracker-src/pitchtracker_ac.dsp | cut -d' ' -f1)
          {
            printf 'BASELINE_ANCHOR\t%s\n' "$BASELINE_TRACKER_SHA"
            printf 'LIVE_TRACKER\t%s\n' "$LIVE"
            printf 'STALE_BASELINE\tno verdict issued\n'
          } > dedup-summary.tsv
          cat dedup-summary.tsv

      - name: Install build dependencies
        if: steps.anchor.outputs.stale != 'true'
        run: sudo apt-get install -y libncurses-dev unzip

      - name: Fetch the pinned libfaust release
        if: steps.anchor.outputs.stale != 'true'
        run: |
          set -e
          curl -fL "https://github.com/grame-cncm/faust/releases/download/${FAUST_VERSION}/libfaust-ubuntu-x86_64.zip" -o libfaust.zip
          mkdir -p faust-lib
          unzip -o libfaust.zip -d faust-lib
          ls -la faust-lib/lib

      - name: Fetch the pinned faust headers
        if: steps.anchor.outputs.stale != 'true'
        run: |
          set -e
          curl -fL "https://github.com/grame-cncm/faust/archive/refs/tags/${FAUST_VERSION}.tar.gz" -o faust-src.tar.gz
          mkdir -p faust-src
          tar -xzf faust-src.tar.gz -C faust-src --wildcards '*/architecture/*'
          ls faust-src/faust-${FAUST_VERSION}

      - name: Fetch the Faust standard library at the pinned commit
        if: steps.anchor.outputs.stale != 'true'
        run: |
          set -e
          curl -fL "https://github.com/grame-cncm/faustlibraries/archive/${FAUST_LIBRARIES_SHA}.tar.gz" -o faustlibraries.tar.gz
          mkdir -p faust-libs
          tar -xzf faustlibraries.tar.gz -C faust-libs --strip-components=1
          ls faust-libs/stdfaust.lib

      - name: Build the renderer against the pinned libfaust
        if: steps.anchor.outputs.stale != 'true'
        run: |
          set -e
          ARCH_DIR=$(ls -d faust-src/faust-${FAUST_VERSION}/architecture)
          g++ -O2 -std=c++17 -Wall -Wextra -I "$ARCH_DIR" \
            tools/ceiling-dedup/render_candidate.cpp \
            faust-lib/lib/libfaustwithllvm.a -lz -lpthread -ldl -lm -ltinfo \
            -o render_candidate

      - name: Generate the five sine inputs and check their hashes
        if: steps.anchor.outputs.stale != 'true'
        run: python3 tools/ceiling-dedup/make_sines.py sines

      - name: Render the candidate in one process
        if: steps.anchor.outputs.stale != 'true'
        run: |
          set -e
          mkdir -p out
          export FAUST_LIBRARY_DIR="$(pwd)/faust-libs"
          ./render_candidate docs/witness/pitch-ceiling/pitchtracker_ac_ceiling_dedup.dsp "$GAIN" out dedup \
            test-audio-corpus/instruments/*.wav \
            sines/sine_*.wav \
            docs/witness/note-change/note_change.wav \
            docs/witness/note-change/note_change_harm.wav \
            docs/witness/note-change/note_change_inharm_freeFreeBeam.wav \
            docs/witness/note-change/note_change_inharm_quoted1x4x10.wav

      - name: Compare against the committed base outputs
        if: steps.anchor.outputs.stale != 'true'
        run: python3 tools/ceiling-dedup/compare.py out dedup-summary.tsv

      - name: Upload the summary and the renders
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ceiling-dedup
          path: dedup-summary.tsv
          if-no-files-found: error
          retention-days: 14
