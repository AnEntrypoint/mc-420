name: diag-faust-flags

on:
  workflow_dispatch:

jobs:
  time-faust:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Faust
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y faust lv2-dev pkg-config build-essential libboost-dev

      - name: Probe for a timeout option
        run: |
          faust --version
          faust --help 2>&1 | grep -i -m5 timeout || echo "NO TIMEOUT FLAG IN HELP"

      - name: Codegen with a raised timeout
        timeout-minutes: 20
        run: |
          set +e
          FAUSTLIB=$(dirname "$(ls -f /usr/share/faust/lv2ui.cpp /usr/local/share/faust/lv2ui.cpp 2>/dev/null | tail -1)")
          start=$(date +%s%N)
          faust -i -a "$FAUSTLIB/lv2.cpp" -vec -fun -dfs -vs 32 -nvi -ct 0 -t 900 -cn probe \
            effects/pitchtracker-src/pitchtracker_ac.dsp -o /tmp/probe.cpp
          rc=$?
          end=$(date +%s%N)
          secs=$(awk "BEGIN{printf \"%.1f\", ($end-$start)/1000000000}")
          size=$(stat -c %s /tmp/probe.cpp 2>/dev/null || echo 0)
          echo "RESULT raised-timeout: rc=$rc seconds=$secs cppBytes=$size"
          free -m | head -2
