name: diag-faust-compile

on:
  workflow_dispatch:

jobs:
  build-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build DSP variants
        run: |
          set -e
          mkdir -p variants
          python3 - <<'PY'
          import io

          src = io.open('effects/pitchtracker-src/pitchtracker_ac.dsp', encoding='utf-8').read()

          LAGCLAMP = '    lagClamped = lagSig : max(1) : min(delayMaxLag);\n'
          TAP = ('    d = rwtable(delayTableSize, 0.0, w, x,'
                 ' (w + delayTableSize - lagClamped) % delayTableSize);\n')
          NUM = '    num = smoo(x * d);\n'
          DEN = '    den = max(1e-9, smoo(x*x));\n'
          TAKENEW = '    takeNew = (demoteNow > 0.5) | (demoteDuty <= 0.5);\n'
          REFINE_CALLS = ('    refinedH = refineFreq(xh, w, coarseFreq * 0.5);\n'
                          '    refined1 = refineFreq(xh, w, coarseFreq);\n'
                          '    refined2 = refineFreq(xh, w, coarseFreq * 2.0);\n'
                          '    refined3 = refineFreq(xh, w, coarseFreq * 3.0);\n'
                          '    refinedNow = ba.if(dominant3, refined3,\n'
                          '               ba.if(dominant2, refined2,\n'
                          '               ba.if(demoteNow, refinedH, refined1)));\n')
          DEMOTE_CALL = '    demoteNow = demoteTest(xh, w, coarseFreq);\n'
          PROMOTE_CALL = '    promotion = subharmonicPromote(xh, w, coarseFreq, demoteNow);\n'

          for frag in (LAGCLAMP, TAP, NUM, DEN, TAKENEW, REFINE_CALLS, DEMOTE_CALL, PROMOTE_CALL):
              assert src.count(frag) == 1, frag

          files = {}
          files['b0_cur'] = src

          files['b1_nohold'] = src.replace(TAKENEW, '    takeNew = 1.0;\n')

          files['b2_norefine'] = src.replace(
              REFINE_CALLS,
              '    refinedNow = ba.if(dominant3, coarseFreq * 3.0,\n'
              '               ba.if(dominant2, coarseFreq * 2.0,\n'
              '               ba.if(demoteNow, coarseFreq * 0.5, coarseFreq)));\n')

          files['b3_onlyrefine'] = (src
              .replace(DEMOTE_CALL, '    demoteNow = 0.0;\n')
              .replace(PROMOTE_CALL, '    promotion = 1.0, 0.9, 0.0, 0.0;\n'))

          files['b5_notaps'] = src.replace(TAP, '    d = 0.5;\n')

          files['b7_fixlag'] = src.replace(LAGCLAMP, '    lagClamped = 100;\n')

          files['b8_nosmoo'] = src.replace(NUM, '    num = x * d;\n').replace(
              DEN, '    den = max(1e-9, x*x);\n')

          for name, text in files.items():
              io.open('variants/%s.dsp' % name, 'w', encoding='utf-8', newline='\n').write(text)
          PY
          ls variants
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-variants
          path: variants/*.dsp

  time-faust:
    needs: build-variants
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [b0_cur, b1_nohold, b2_norefine, b3_onlyrefine, b5_notaps, b7_fixlag, b8_nosmoo]
    steps:
      - name: Install Faust
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y faust lv2-dev pkg-config build-essential libboost-dev

      - uses: actions/download-artifact@v4
        with:
          name: dsp-variants
          path: variants

      - name: Codegen ${{ matrix.variant }}
        timeout-minutes: 15
        run: |
          set +e
          V=${{ matrix.variant }}
          FAUSTLIB=$(dirname "$(ls -f /usr/share/faust/lv2ui.cpp /usr/local/share/faust/lv2ui.cpp 2>/dev/null | tail -1)")
          start=$(date +%s%N)
          faust -i -a "$FAUSTLIB/lv2.cpp" -vec -fun -dfs -vs 32 -nvi -ct 0 -cn probe \
            "variants/$V.dsp" -o /tmp/probe.cpp
          rc=$?
          end=$(date +%s%N)
          secs=$(awk "BEGIN{printf \"%.1f\", ($end-$start)/1000000000}")
          size=$(stat -c %s /tmp/probe.cpp 2>/dev/null || echo 0)
          echo "RESULT $V: rc=$rc seconds=$secs cppBytes=$size"
