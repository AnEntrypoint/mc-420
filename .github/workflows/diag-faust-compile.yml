name: diag-faust-compile

on:
  workflow_dispatch:

jobs:
  build-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build DSP variants
        run: |
          set -e
          mkdir -p variants
          python3 - <<'PY'
          import io

          src = io.open('effects/pitchtracker-src/pitchtracker_ac.dsp', encoding='utf-8').read()

          LAGCLAMP = '    lagClamped = lagSig : max(1) : min(delayMaxLag);\n'
          TAPBODY = ('    d = rwtable(delayTableSize, 0.0, w, x,'
                     ' (w + delayTableSize - lagClamped) % delayTableSize);\n')
          TAKENEW = '    takeNew = (demoteNow > 0.5) | (demoteDuty <= 0.5);\n'
          REFINE_CALLS = ('    refinedH = refineFreq(xh, w, coarseFreq * 0.5);\n'
                          '    refined1 = refineFreq(xh, w, coarseFreq);\n'
                          '    refined2 = refineFreq(xh, w, coarseFreq * 2.0);\n'
                          '    refined3 = refineFreq(xh, w, coarseFreq * 3.0);\n'
                          '    refinedNow = ba.if(dominant3, refined3,\n'
                          '               ba.if(dominant2, refined2,\n'
                          '               ba.if(demoteNow, refinedH, refined1)));\n')
          DEMOTE_CALL = '    demoteNow = demoteTest(xh, w, coarseFreq);\n'
          PROMOTE_CALL = '    promotion = subharmonicPromote(xh, w, coarseFreq, demoteNow);\n'

          for frag in (TAKENEW, REFINE_CALLS, DEMOTE_CALL, PROMOTE_CALL):
              assert src.count(frag) == 1, frag

          start = src.index('corrAtLagVar(x, w, lagSig)')
          end = src.index('\n};\n', start) + len('\n};\n')
          block = src[start:end]
          assert LAGCLAMP in block and TAPBODY in block and 'num = smoo(x * d);' in block

          def retap(new_block):
              assert new_block != block
              return src[:start] + new_block + src[end:]

          files = {}
          files['b0_cur'] = src

          files['b1_nohold'] = src.replace(TAKENEW, '    takeNew = 1.0;\n')

          files['b2_norefine'] = src.replace(
              REFINE_CALLS,
              '    refinedNow = ba.if(dominant3, coarseFreq * 3.0,\n'
              '               ba.if(dominant2, coarseFreq * 2.0,\n'
              '               ba.if(demoteNow, coarseFreq * 0.5, coarseFreq)));\n')

          files['b3_onlyrefine'] = (src
              .replace(DEMOTE_CALL, '    demoteNow = 0.0;\n')
              .replace(PROMOTE_CALL, '    promotion = 1.0, 0.9, 0.0, 0.0;\n'))

          files['b5_notaps'] = retap(block.replace(TAPBODY, '    d = 0.5;\n'))

          files['b7_fixlag'] = retap(block.replace(LAGCLAMP, '    lagClamped = 100;\n'))

          files['b8_nosmoo'] = retap(
              block.replace('    num = smoo(x * d);\n', '    num = x * d;\n')
                   .replace('    den = max(1e-9, smoo(x*x));\n', '    den = max(1e-9, x*x);\n'))

          files['c1_demoteonly'] = files['b2_norefine'].replace(
              PROMOTE_CALL, '    promotion = 1.0, 0.9, 0.0, 0.0;\n')

          files['c2_promoteonly'] = files['b2_norefine'].replace(
              DEMOTE_CALL, '    demoteNow = 0.0;\n')

          files['c3_ref1only'] = src.replace(
              REFINE_CALLS, '    refinedNow = refineFreq(xh, w, coarseFreq);\n')

          files['d1_allmux2'] = src.replace('ba.if(', 'mux2(') + \
              '\nmux2(c, a, b) = a*c + b*(1.0-c);\n'

          files['d2_decidemux2'] = (src
              .replace('    pBase = ba.if(demoteNow, rawH, raw1);',
                       '    pBase = mux2(demoteNow, rawH, raw1);')
              .replace('    promotedRatio = ba.if(dominant3, 3.0, ba.if(dominant2, 2.0, ba.if(demoteNow, 0.5, 1.0)));',
                       '    promotedRatio = mux2(dominant3, 3.0, mux2(dominant2, 2.0, mux2(demoteNow, 0.5, 1.0)));')
              .replace('    promotedConfidence = ba.if(dominant3, raw3, ba.if(dominant2, raw2, pBase));',
                       '    promotedConfidence = mux2(dominant3, raw3, mux2(dominant2, raw2, pBase));')
              .replace('    refinedNow = ba.if(dominant3, refined3,\n'
                       '               ba.if(dominant2, refined2,\n'
                       '               ba.if(demoteNow, refinedH, refined1)));',
                       '    refinedNow = mux2(dominant3, refined3,\n'
                       '               mux2(dominant2, refined2,\n'
                       '               mux2(demoteNow, refinedH, refined1)));')
              + '\nmux2(c, a, b) = a*c + b*(1.0-c);\n')
          span_start = src.index('refineFreq(x, w, coarseFreq)')
          span_end = src.index('onsetHoldMs = 35.0;')

          def span(lag_lines, raw_args, refine_args):
              return (
                  'refineFreq(x, w, lagL0) = refinedFreq\n'
                  'with {\n'
                  '    L0 = lagL0 : max(2 + refineSpreadK) : min(3199 - refineSpreadK);\n'
                  '    cLo  = corrAtLagVar(x, w, L0 - refineSpreadK);\n'
                  '    cMid = corrAtLagVar(x, w, L0);\n'
                  '    cHi  = corrAtLagVar(x, w, L0 + refineSpreadK);\n'
                  '    denom = cLo - 2.0*cMid + cHi;\n'
                  '    safeDenom = ba.if(abs(denom) < 1e-6, 1e-6, denom);\n'
                  '    delta = 0.5 * (cLo - cHi) / safeDenom : max(-1.0) : min(1.0);\n'
                  '    delta2 = ba.if(abs(denom) < 1e-6, 0.0, delta);\n'
                  '    refinedLag = float(L0) + delta2 * refineSpreadK;\n'
                  '    refinedFreq = ma.SR / max(1.0, refinedLag);\n'
                  '};\n'
                  '\n'
                  'peakSpreadK = 1;\n'
                  '\n'
                  'corrPeakAt(x, w, lagL0) = vertex\n'
                  'with {\n'
                  '    L0 = lagL0 : max(2 + peakSpreadK) : min(3199 - peakSpreadK);\n'
                  '    cLo  = corrAtLagVar(x, w, L0 - peakSpreadK);\n'
                  '    cMid = corrAtLagVar(x, w, L0);\n'
                  '    cHi  = corrAtLagVar(x, w, L0 + peakSpreadK);\n'
                  '    denom = cLo - 2.0*cMid + cHi;\n'
                  '    safeDenom = ba.if(denom > -1e-9, -1e-9, denom);\n'
                  '    vertex = (cMid - (cLo - cHi)*(cLo - cHi) / (8.0 * safeDenom)) : max(-1.0) : min(1.0);\n'
                  '};\n'
                  '\n'
                  'subharmDominanceMargin = 0.004;\n'
                  '\n'
                  'demoteTau = 0.2;\n'
                  'demotePole = ba.tau2pole(demoteTau);\n'
                  '\n'
                  'corrRawAt(x, w, lagSig) = corrAtLagVar(x, w, lagSig);\n'
                  '\n'
                  'demoteTest(x, w, lagC, lagH, freqH) = demoteNow\n'
                  'with {\n'
                  '    pCoarse = corrPeakAt(x, w, lagC);\n'
                  '    pH = corrPeakAt(x, w, lagH);\n'
                  '    demoteNow = (freqH >= minTrackHz) & (pH >= corrThresh)'
                  ' & (pH > pCoarse + subharmDominanceMargin);\n'
                  '};\n'
                  '\n'
                  'subharmonicPromote(x, w, lagRH, lagR1, lagR2, lagR3, freq2, freq3, demoteNow) ='
                  ' promotedRatio, promotedConfidence, dominant3, dominant2\n'
                  'with {\n'
                  '    rawH = corrRawAt(x, w, lagRH);\n'
                  '    raw1 = corrRawAt(x, w, lagR1);\n'
                  '    raw2 = corrRawAt(x, w, lagR2);\n'
                  '    raw3 = corrRawAt(x, w, lagR3);\n'
                  '    pBase = ba.if(demoteNow, rawH, raw1);\n'
                  '    reachable2 = freq2 <= maxTrackHz;\n'
                  '    reachable3 = freq3 <= maxTrackHz;\n'
                  '    notDemoted = 1.0 - demoteNow;\n'
                  '    dominant3 = reachable3 & (raw3 >= corrThresh)'
                  ' & (raw3 > pBase + subharmDominanceMargin) & (raw3 >= raw2) & (notDemoted > 0.5);\n'
                  '    dominant2 = reachable2 & (raw2 >= corrThresh)'
                  ' & (raw2 > pBase + subharmDominanceMargin) & (notDemoted > 0.5);\n'
                  '    promotedRatio = ba.if(dominant3, 3.0, ba.if(dominant2, 2.0, ba.if(demoteNow, 0.5, 1.0)));\n'
                  '    promotedConfidence = ba.if(dominant3, raw3, ba.if(dominant2, raw2, pBase));\n'
                  '};\n'
                  '\n'
                  'detectedFreq(x) = heldFreq, confident\n'
                  'with {\n'
                  '    xh = xHp(x);\n'
                  '    w = tableStep ~ _;\n'
                  '    coarseFreq = pickFundamental(xh);\n'
                  + lag_lines +
                  '    demoteNow = demoteTest(xh, w, lagC, lagH, coarseFreq * 0.5);\n'
                  '    demoteDuty = demoteNow : *(1.0-demotePole) : + ~ *(demotePole);\n'
                  '    promotion = subharmonicPromote(xh, w, %s, coarseFreq * 2.0, coarseFreq * 3.0,'
                  ' demoteNow);\n' % raw_args +
                  '    dominant3 = promotion : (!, !, _, !);\n'
                  '    dominant2 = promotion : (!, !, !, _);\n'
                  '    finalConfidence = promotion : (!, _, !, !);\n'
                  '    refinedH = refineFreq(xh, w, %s);\n'
                  '    refined1 = refineFreq(xh, w, %s);\n'
                  '    refined2 = refineFreq(xh, w, %s);\n'
                  '    refined3 = refineFreq(xh, w, %s);\n' % refine_args +
                  '    refinedNow = ba.if(dominant3, refined3,\n'
                  '               ba.if(dominant2, refined2,\n'
                  '               ba.if(demoteNow, refinedH, refined1)));\n'
                  '    takeNew = (demoteNow > 0.5) | (demoteDuty <= 0.5);\n'
                  '    holdStep(prev) = ba.if(takeNew, refinedNow, prev);\n'
                  '    heldFreq = holdStep ~ _;\n'
                  '    confident = finalConfidence >= corrThresh;\n'
                  '};\n'
                  '\n')

          def rebuild(lag_lines, raw_args, refine_args):
              return src[:span_start] + span(lag_lines, raw_args, refine_args) + src[span_end:]

          LAG_ONE = ('    lagC = int(ma.SR / coarseFreq);\n'
                     '    lagH = lagC * 2;\n'
                     '    lag2 = int(float(lagC) * 0.5);\n'
                     '    lag3 = int(float(lagC) / 3.0);\n')
          files['e1_onelag'] = rebuild(LAG_ONE, 'lagH, lagC, lag2, lag3',
                                       ('lagH', 'lagC', 'lag2', 'lag3'))

          LAG_TWO = (LAG_ONE +
                     '    lagR = int(ma.SR / coarseFreq + 0.5);\n'
                     '    lagRH = lagR * 2;\n'
                     '    lagR2 = int(float(lagR) * 0.5);\n'
                     '    lagR3 = int(float(lagR) / 3.0);\n')
          files['e3_roundall'] = rebuild(LAG_TWO, 'lagRH, lagR, lagR2, lagR3',
                                         ('lagRH', 'lagR', 'lagR2', 'lagR3'))

          for name, text in files.items():
              io.open('variants/%s.dsp' % name, 'w', encoding='utf-8', newline='\n').write(text)
          PY
          ls variants
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-variants
          path: variants/*.dsp

  time-faust:
    needs: build-variants
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [e1_onelag, e2_twolag, e3_roundall]
    steps:
      - name: Install Faust
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y faust lv2-dev pkg-config build-essential libboost-dev

      - uses: actions/download-artifact@v4
        with:
          name: dsp-variants
          path: variants

      - name: Codegen ${{ matrix.variant }}
        timeout-minutes: 15
        run: |
          set +e
          V=${{ matrix.variant }}
          FAUSTLIB=$(dirname "$(ls -f /usr/share/faust/lv2ui.cpp /usr/local/share/faust/lv2ui.cpp 2>/dev/null | tail -1)")
          start=$(date +%s%N)
          faust -i -a "$FAUSTLIB/lv2.cpp" -vec -fun -dfs -vs 32 -nvi -ct 0 -cn probe \
            "variants/$V.dsp" -o /tmp/probe.cpp
          rc=$?
          end=$(date +%s%N)
          secs=$(awk "BEGIN{printf \"%.1f\", ($end-$start)/1000000000}")
          size=$(stat -c %s /tmp/probe.cpp 2>/dev/null || echo 0)
          echo "RESULT $V: rc=$rc seconds=$secs cppBytes=$size"
