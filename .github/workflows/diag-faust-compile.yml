name: diag-faust-compile

on:
  workflow_dispatch:

jobs:
  build-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build DSP variants
        run: |
          set -e
          mkdir -p variants
          git show 1bf8bfdd:effects/pitchtracker-src/pitchtracker_ac.dsp > variants/0_predemote.dsp
          python3 - <<'PY'
          import io

          pred = io.open('variants/0_predemote.dsp', encoding='utf-8').read()

          PROC_HEAD = 'process(sig) = holdLastGood(rawFreq, ready, confident)\n'
          TAIL = ('    rawFreq = rawFreqUnclamped : max(minTrackHz) : min(maxTrackHz);\n'
                  '    ready = energyReady(sig);\n')
          assert pred.count(PROC_HEAD) == 1
          assert pred.count(TAIL) == 1

          LAGSIG = '    probeLag(k) = int(ma.SR / max(60.0, min(1500.0, rawFreq))) + k;\n'
          LAGF = '    probeLagF(k) = ma.SR / max(60.0, min(1500.0, rawFreq)) + k;\n'
          WINT = ('    probeStep(prev) = int(prev + 1) % 4096;\n'
                  '    probeW = probeStep ~ _;\n')
          WFLT = '    probeW = ((+(1) ~ _) % 4096);\n'

          def inject(defs, body):
              out = pred.replace(PROC_HEAD,
                                 'process(sig) = holdLastGood(rawFreq, ready, confident) + 1e-9*probeSum\n')
              return out.replace(TAIL, TAIL + defs + '    probeSum = ' + body + ';\n')

          def rwt(n, wname):
              return ('sum(i, %d, rwtable(4096, 0.0, %s, sig,'
                      ' (%s + 4096 - probeLag(i*7)) %% 4096))' % (n, wname, wname))

          files = {}
          files['1_wint_only'] = inject(WINT, 'probeW')
          files['2_wflt_only'] = inject(WFLT, 'probeW')
          files['3_rw1_int'] = inject(WINT + LAGSIG, rwt(1, 'probeW'))
          files['4_rw4_int'] = inject(WINT + LAGSIG, rwt(4, 'probeW'))
          files['5_rw8_int'] = inject(WINT + LAGSIG, rwt(8, 'probeW'))
          files['6_rw13_int'] = inject(WINT + LAGSIG, rwt(13, 'probeW'))
          files['7_rw4_flt'] = inject(WFLT + LAGSIG, rwt(4, 'probeW'))
          files['8_rw13_flt'] = inject(WFLT + LAGSIG, rwt(13, 'probeW'))
          files['9_fd1'] = inject(LAGF, 'sum(i, 1, de.fdelay(3201, probeLagF(i*7), sig))')
          files['a_fd13'] = inject(LAGF, 'sum(i, 13, de.fdelay(3201, probeLagF(i*7), sig))')

          for name, text in files.items():
              io.open('variants/%s.dsp' % name, 'w', encoding='utf-8', newline='\n').write(text)
          PY
          ls variants
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-variants
          path: variants/*.dsp

  time-faust:
    needs: build-variants
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [0_predemote, 1_wint_only, 2_wflt_only, 3_rw1_int, 4_rw4_int, 5_rw8_int,
                  6_rw13_int, 7_rw4_flt, 8_rw13_flt, 9_fd1, a_fd13]
    steps:
      - name: Install Faust
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y faust lv2-dev pkg-config build-essential libboost-dev

      - uses: actions/download-artifact@v4
        with:
          name: dsp-variants
          path: variants

      - name: Codegen ${{ matrix.variant }}
        timeout-minutes: 15
        run: |
          set +e
          V=${{ matrix.variant }}
          FAUSTLIB=$(dirname "$(ls -f /usr/share/faust/lv2ui.cpp /usr/local/share/faust/lv2ui.cpp 2>/dev/null | tail -1)")
          start=$(date +%s%N)
          faust -i -a "$FAUSTLIB/lv2.cpp" -vec -fun -dfs -vs 32 -nvi -ct 0 -cn probe \
            "variants/$V.dsp" -o /tmp/probe.cpp
          rc=$?
          end=$(date +%s%N)
          secs=$(awk "BEGIN{printf \"%.1f\", ($end-$start)/1000000000}")
          size=$(stat -c %s /tmp/probe.cpp 2>/dev/null || echo 0)
          echo "RESULT $V: rc=$rc seconds=$secs cppBytes=$size"
