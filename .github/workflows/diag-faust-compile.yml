name: diag-faust-compile

on:
  workflow_dispatch:

jobs:
  probe-runner:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Does a 150s command survive a step with timeout-minutes 15
        timeout-minutes: 15
        run: |
          set +e
          start=$(date +%s)
          sleep 150
          rc=$?
          end=$(date +%s)
          echo "PROBE sleep150 rc=$rc elapsed=$((end-start))s"

  build-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build DSP variants
        run: |
          set -e
          mkdir -p variants
          git show 1bf8bfdd:effects/pitchtracker-src/pitchtracker_ac.dsp > variants/0_predemote.dsp
          cp effects/pitchtracker-src/pitchtracker_ac.dsp variants/1_current.dsp
          python3 - <<'PY'
          import io

          pred = io.open('variants/0_predemote.dsp', encoding='utf-8').read()

          PROC_HEAD = 'process(sig) = holdLastGood(rawFreq, ready, confident)\n'
          TAIL = ('    rawFreq = rawFreqUnclamped : max(minTrackHz) : min(maxTrackHz);\n'
                  '    ready = energyReady(sig);\n')
          assert pred.count(PROC_HEAD) == 1
          assert pred.count(TAIL) == 1

          LAGSIG = ('    probeLag(k) = int(ma.SR / max(60.0, min(1500.0, rawFreq))) + k;\n')


          def inject(body):
              out = pred.replace(PROC_HEAD,
                                 'process(sig) = holdLastGood(rawFreq, ready, confident) + 1e-9*probeSum\n')
              out = out.replace(TAIL, TAIL + LAGSIG + '    probeSum = ' + body + ';\n')
              return out


          files = {}
          for n in (8, 32, 148):
              files['fix%d' % n] = inject('sum(i, %d, corrAtLagTau(sig, 40 + i*37, 0.01))' % n)
          for n in (1, 4):
              files['var%d' % n] = inject('sum(i, %d, corrAtLagVar(sig, probeLag(i*7)))' % n)
          files['rw4'] = pred.replace(
              PROC_HEAD,
              'process(sig) = holdLastGood(rawFreq, ready, confident) + 1e-9*probeSum\n').replace(
              TAIL,
              TAIL + '    probeW = ((+(1) ~ _) % 4096);\n' + LAGSIG +
              '    probeSum = sum(i, 4, rwtable(4096, 0.0, probeW, sig,'
              ' (probeW - probeLag(i*7)) % 4096));\n')

          for name, text in files.items():
              io.open('variants/%s.dsp' % name, 'w', encoding='utf-8', newline='\n').write(text)
          PY
          ls -la variants
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-variants
          path: variants/*.dsp

  time-faust:
    needs: build-variants
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [0_predemote, fix8, fix32, fix148, var1, var4, rw4, 1_current]
    steps:
      - name: Install Faust
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y faust lv2-dev pkg-config build-essential libboost-dev

      - uses: actions/download-artifact@v4
        with:
          name: dsp-variants
          path: variants

      - name: Codegen ${{ matrix.variant }}
        timeout-minutes: 15
        run: |
          set +e
          V=${{ matrix.variant }}
          FAUSTLIB=$(dirname "$(ls -f /usr/share/faust/lv2ui.cpp /usr/local/share/faust/lv2ui.cpp 2>/dev/null | tail -1)")
          start=$(date +%s%N)
          faust -i -a "$FAUSTLIB/lv2.cpp" -vec -fun -dfs -vs 32 -nvi -ct 0 -cn probe \
            "variants/$V.dsp" -o /tmp/probe.cpp
          rc=$?
          end=$(date +%s%N)
          secs=$(awk "BEGIN{printf \"%.1f\", ($end-$start)/1000000000}")
          size=$(stat -c %s /tmp/probe.cpp 2>/dev/null || echo 0)
          echo "RESULT $V: rc=$rc seconds=$secs cppBytes=$size"
