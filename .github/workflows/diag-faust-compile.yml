name: diag-faust-compile

on:
  workflow_dispatch:

jobs:
  build-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build DSP variants
        run: |
          set -e
          mkdir -p variants
          python3 - <<'PY'
          import io

          src = io.open('effects/pitchtracker-src/pitchtracker_ac.dsp', encoding='utf-8').read()

          COARSE = '    coarseFreq = pickFundamental(xh);\n'
          assert src.count(COARSE) == 1

          REFINE = '    L0 = int(ma.SR / coarseFreq) : max(2 + refineSpreadK) : min(3199 - refineSpreadK);\n'
          PEAK = '    L0 = int(ma.SR / freqHz) : max(2 + peakSpreadK) : min(3199 - peakSpreadK);\n'
          RAW = 'corrRawAt(x, w, freqHz) = corrAtLagVar(x, w, int(ma.SR / freqHz + 0.5));\n'
          assert src.count(REFINE) == 1
          assert src.count(PEAK) == 1
          assert src.count(RAW) == 1

          files = {}
          files['m0_cur'] = src

          files['m1_fnmem'] = (src
              .replace(REFINE, '    L0 = lagSafe(coarseFreq) : max(2 + refineSpreadK) : min(3199 - refineSpreadK);\n')
              .replace(PEAK, '    L0 = lagSafe(freqHz) : max(2 + peakSpreadK) : min(3199 - peakSpreadK);\n')
              .replace(RAW, 'corrRawAt(x, w, freqHz) = corrAtLagVar(x, w, int(ma.SR / lagSafeDiv(freqHz) + 0.5));\n')
              + '\nlagSafe(f) = int(ma.SR / ((f : mem) : max(minTrackHz)));\n'
              + 'lagSafeDiv(f) = (f : mem) : max(minTrackHz);\n')

          files['m2_sharedmem'] = src.replace(
              COARSE, '    coarseFreq = pickFundamental(xh) : mem : max(minTrackHz);\n')

          files['m3_sharedmem_nowrite'] = src.replace(
              COARSE, '    coarseFreq = pickFundamental(xh) : mem;\n')

          for name, text in files.items():
              io.open('variants/%s.dsp' % name, 'w', encoding='utf-8', newline='\n').write(text)
          PY
          ls variants
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-variants
          path: variants/*.dsp

  time-faust:
    needs: build-variants
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [m0_cur, m1_fnmem, m2_sharedmem, m3_sharedmem_nowrite]
    steps:
      - name: Install Faust
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y faust lv2-dev pkg-config build-essential libboost-dev

      - uses: actions/download-artifact@v4
        with:
          name: dsp-variants
          path: variants

      - name: Codegen ${{ matrix.variant }}
        timeout-minutes: 15
        run: |
          set +e
          V=${{ matrix.variant }}
          FAUSTLIB=$(dirname "$(ls -f /usr/share/faust/lv2ui.cpp /usr/local/share/faust/lv2ui.cpp 2>/dev/null | tail -1)")
          start=$(date +%s%N)
          faust -i -a "$FAUSTLIB/lv2.cpp" -vec -fun -dfs -vs 32 -nvi -ct 0 -cn probe \
            "variants/$V.dsp" -o /tmp/probe.cpp
          rc=$?
          end=$(date +%s%N)
          secs=$(awk "BEGIN{printf \"%.1f\", ($end-$start)/1000000000}")
          size=$(stat -c %s /tmp/probe.cpp 2>/dev/null || echo 0)
          echo "RESULT $V: rc=$rc seconds=$secs cppBytes=$size"
