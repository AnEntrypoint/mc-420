name: diag-faust-compile

on:
  workflow_dispatch:

jobs:
  build-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build DSP variants
        run: |
          set -e
          mkdir -p variants
          git show ccf698d:effects/pitchtracker-src/pitchtracker_ac.dsp > variants/1_baseline.dsp
          python3 - <<'PY'
          import io

          src = io.open('effects/pitchtracker-src/pitchtracker_ac.dsp', encoding='utf-8').read()

          DAMPER = '    demoteDuty = demoteNow : *(1.0-demotePole) : + ~ *(demotePole);\n'
          HOLD = ('    takeNew = (demoteNow > 0.5) | (demoteDuty <= 0.5);\n'
                  '    holdStep(prev) = ba.if(takeNew, refinedNow, prev);\n'
                  '    heldFreq = holdStep ~ _;\n')
          HOLD_REPL = '    heldFreq = refinedNow;\n'
          DEMOTE_CALL = '    demoteNow = demoteTest(xh, coarseFreq);\n'
          DEMOTE_CALL_REPL = '    demoteNow = 0.0;\n'
          PROMO = ('    promotion = subharmonicPromote(xh, coarseFreq, demoteNow);\n'
                   '    corrected = promotion : (_, !);\n'
                   '    finalConfidence = promotion : (!, _);\n')
          PROMO_REPL = ('    corrected = ba.if(demoteNow, coarseFreq * 0.5, coarseFreq);\n'
                        '    finalConfidence = 1.0;\n')
          DEMOTE_PEAK = ('    pCoarse = corrPeakAt(x, coarseFreq);\n'
                         '    freqH = coarseFreq * 0.5;\n'
                         '    pH = corrPeakAt(x, freqH);\n')
          DEMOTE_RAW = ('    pCoarse = corrRawAt(x, coarseFreq);\n'
                        '    freqH = coarseFreq * 0.5;\n'
                        '    pH = corrRawAt(x, freqH);\n')


          def req(text, needle, n, tag):
              got = text.count(needle)
              assert got == n, '%s: count=%d want=%d' % (tag, got, n)


          req(src, DAMPER, 1, 'damper')
          req(src, HOLD, 1, 'hold')
          req(src, DEMOTE_CALL, 1, 'demote call')
          req(src, PROMO, 1, 'promo')
          req(src, DEMOTE_PEAK, 1, 'peak')

          nodamper = src.replace(DAMPER, '').replace(HOLD, HOLD_REPL)
          assert 'holdStep(' not in nodamper
          assert 'holdStep ~' not in nodamper
          nopromo = src.replace(PROMO, PROMO_REPL)

          files = {
              '2_current': src,
              '3_nodamper': nodamper,
              '4_nodemote': nodamper.replace(DEMOTE_CALL, DEMOTE_CALL_REPL),
              '5_demoteonly': nopromo,
              '6_demoteraw': src.replace(DEMOTE_PEAK, DEMOTE_RAW),
              '7_allpeak': src.replace('corrRawAt', 'corrPeakAt'),
              '8_refineonly': nopromo.replace(DAMPER, '').replace(HOLD, HOLD_REPL)
                                      .replace(DEMOTE_CALL, DEMOTE_CALL_REPL),
          }
          for name, text in files.items():
              io.open('variants/%s.dsp' % name, 'w', encoding='utf-8',
                      newline='\n').write(text)
          PY
          ls -la variants
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-variants
          path: variants/*.dsp

  time-variant:
    needs: build-variants
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [1_baseline, 8_refineonly, 4_nodemote, 6_demoteraw, 5_demoteonly,
                  3_nodamper, 2_current, 7_allpeak]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-dawdreamer-${{ runner.os }}-312-faustdiag

      - name: Install Faust + Python DawDreamer deps
        run: |
          sudo apt-get update
          sudo apt-get install -y faust
          pip install --upgrade pip
          pip install dawdreamer numpy

      - uses: actions/download-artifact@v4
        with:
          name: dsp-variants
          path: variants

      - name: Compile ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import io
          import os
          import signal
          import time

          name = os.environ['VARIANT']
          CAP = 1500.0


          def rss_mb(pid):
              try:
                  with io.open('/proc/%d/status' % pid, encoding='utf-8') as fh:
                      for line in fh:
                          if line.startswith('VmRSS:'):
                              return int(line.split()[1]) / 1024.0
              except (IOError, OSError):
                  return 0.0
              return 0.0


          src = io.open('variants/%s.dsp' % name, encoding='utf-8').read()
          t0 = time.time()
          pid = os.fork()
          if pid == 0:
              try:
                  import dawdreamer as dd
                  eng = dd.RenderEngine(48000, 64)
                  fp = eng.make_faust_processor(name)
                  fp.compile_flags = ["-vec", "-fun", "-dfs", "-vs", "32", "-ct", "0"]
                  fp.set_dsp_string(src)
                  ok = fp.compile()
                  msg = 'ok=%s seconds=%.1f' % (ok, time.time() - t0)
              except BaseException as exc:
                  msg = 'ERROR %s' % str(exc)[:200]
              with io.open('child.txt', 'w', encoding='utf-8') as fh:
                  fh.write(msg)
              os._exit(0)

          peak = 0.0
          status = None
          while True:
              wpid, st = os.waitpid(pid, os.WNOHANG)
              peak = max(peak, rss_mb(pid))
              if wpid == pid:
                  status = st
                  break
              if time.time() - t0 > CAP:
                  os.kill(pid, signal.SIGKILL)
                  os.waitpid(pid, 0)
                  status = 'CAP'
                  break
              time.sleep(1.0)

          elapsed = time.time() - t0
          msg = ''
          try:
              msg = io.open('child.txt', encoding='utf-8').read()
          except (IOError, OSError):
              msg = 'NO RESULT FILE (killed)'
          print('RESULT %s: %s wall=%.1fs peakRSS=%.0fMB status=%s'
                % (name, msg, elapsed, peak, status), flush=True)
          PY
        env:
          VARIANT: ${{ matrix.variant }}
