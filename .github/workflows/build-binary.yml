name: build-binary

on:
  push:
    paths:
      - 'src/**'
      - 'dsp/**'
      - 'effects/**'
      - '.github/workflows/build-binary.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'dsp/**'
      - 'effects/**'
      - '.github/workflows/build-binary.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aloop-aarch64-musl:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pre-generate the Faust loop engine C++ (on the host, where faust exists)
        run: |
          sudo apt-get update && sudo apt-get install -y faust
          mkdir -p build
          faust -lang cpp -vec -fun -dfs -vs 32 -nvi -ct 0 -cn AloopPreDsp -I dsp -I effects/home/faust dsp/aloop_pre.dsp -o build/loop_pre.cpp
          faust -lang cpp -vec -fun -dfs -vs 32 -nvi -ct 0 -cn AloopPostDsp -I dsp -I effects/home/faust dsp/aloop_post.dsp -o build/loop_post.cpp
          echo "generated $(wc -l < build/loop_pre.cpp) + $(wc -l < build/loop_post.cpp) lines of loop C++"


      - name: Build in an Alpine aarch64 container
        timeout-minutes: 30
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/w -w /w alpine:3.20 sh -c '
            set -ex
            timeout 300 apk add --no-cache build-base cmake pkgconf git \
              alsa-lib-dev lilv-dev lv2-dev zlib-dev \
              linux-headers eudev-dev
            echo "toolchain:"; gcc --version | head -1; faust --version | head -1
            if [ -f src/CMakeLists.txt ]; then
              timeout 120 cmake -S src -B build -DCMAKE_BUILD_TYPE=Release
              timeout 1500 cmake --build build -j"$(nproc)"
              ls -la build/aloop || (echo "::error::aloop binary not produced" && exit 1)
            else
              echo "src/CMakeLists.txt not present yet — verified musl deps resolve:"
              apk info -e alsa-lib-dev lilv-dev lv2-dev && echo "all audio deps present under musl (ADR-001 musl-compat gate PASS)"
            fi
          '

      - name: Upload aloop binary (if built)
        if: hashFiles('build/aloop') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aloop-aarch64-musl
          path: build/aloop
          retention-days: 3
