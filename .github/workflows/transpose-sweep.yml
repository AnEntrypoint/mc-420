name: transpose-sweep
on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit to test
        required: false
        default: main

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Report tested commit
        run: git log --oneline -1
      - name: Build harness against the real FFI
        run: |
          g++ -std=c++17 -O2 -I effects/home/faust \
            test-audio-corpus/multitranspose_harness.cpp -o /tmp/mt -lm
      - name: Sweep pitch x shift, measure OUTPUT PITCH accuracy
        run: |
          python3 - <<'PY'
import math, struct, subprocess
SR=48000; N=SR

def tone(path,f0,harm):
    b=bytearray()
    for n in range(N):
        t=n/SR; v=sum((1.0/h)*math.sin(2*math.pi*f0*h*t) for h in range(1,harm+1))*0.25
        b+=struct.pack('<f',v*min(1.0,n/(SR*0.01)))
    open(path,'wb').write(b)

def rd(p):
    d=open(p,'rb').read(); return list(struct.unpack('<%df'%(len(d)//4),d))

def pitch_hz(x,expect):
    seg=x[SR//2:SR//2+8192]
    if max(abs(v) for v in seg)<1e-5: return 0.0
    best,bestc=0,-9
    lo=int(SR/(expect*1.6)); hi=int(SR/(expect*0.62))
    m=sum(seg)/len(seg); s=[v-m for v in seg]
    e=sum(v*v for v in s)
    for lag in range(max(20,lo),min(hi,len(s)//2)):
        c=sum(s[i]*s[i+lag] for i in range(0,len(s)-lag,4))
        c/= (e+1e-12)
        if c>bestc: bestc,best=c,lag
    return SR/best if best else 0.0

print(f"{'f0':>7} {'harm':>4} {'semis':>6} {'want':>8} {'got':>8} {'cents':>8}  verdict")
bad=0
for f0 in [110.0,146.8,196.0,261.6,329.6,440.0]:
    for harm in [1,6]:
        tone('/tmp/in.f32',f0,harm)
        for semis in [-12,-5,0,5,12]:
            sc=2.0**(semis/12.0)
            subprocess.run(['/tmp/mt','/tmp/in.f32','/tmp/out.f32',str(sc)],check=True,capture_output=True)
            want=f0*sc; got=pitch_hz(rd('/tmp/out.f32'),want)
            cents=1200*math.log2(got/want) if got>0 else -9999
            v=''
            if abs(cents)>35: v='BAD'; bad+=1
            print(f"{f0:7.1f} {harm:4d} {semis:6d} {want:8.1f} {got:8.1f} {cents:8.1f}  {v}")
print(); print("TOTAL BAD:",bad)
PY
