name: diag-timbre-variant

on:
  workflow_dispatch:

jobs:
  variant:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        name:
          - shipped
          - stable_p150_f512
          - stable_p150_f1024
          - stable_p300_f1024
    steps:
      - uses: actions/checkout@v4

      - name: Install Faust
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y faust build-essential python3-numpy

      - name: Render ${{ matrix.name }} under a timbre shift
        timeout-minutes: 30
        run: |
          python3 test/pitch-tracker-transient/diag_timbre_variant.py ${{ matrix.name }}
