name: diag-timbre-variant

on:
  workflow_dispatch:

jobs:
  variant:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        name:
          - shipped
          - coarse_f512
          - coarse_f2048
          - stable_f512
    steps:
      - uses: actions/checkout@v4

      - name: Install Faust
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y faust build-essential python3-numpy

      - name: Render ${{ matrix.name }} under a timbre shift
        timeout-minutes: 30
        run: |
          python3 test/pitch-tracker-transient/mem_log.py &
          /usr/bin/time -v python3 test/pitch-tracker-transient/diag_timbre_variant.py ${{ matrix.name }}
