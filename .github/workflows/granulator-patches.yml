name: granulator-patches

on:
  push:
    paths:
      - 'tools/granulator-patches/**'
      - 'src/dsp/sampler/sampler.h'
      - '.github/workflows/granulator-patches.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the harness against sampler.h
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I src/dsp/sampler \
            tools/granulator-patches/render_patches.cpp -o render_patches

      - name: Render the held chord for each patch and measure
        run: ./render_patches tools/granulator-patches/patches.tsv granulator-patches.tsv

      - name: Upload the measurements
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: granulator-patches
          path: granulator-patches.tsv
          if-no-files-found: error
          retention-days: 14
