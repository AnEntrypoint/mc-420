name: test-loop-sim

on:
  push:
    paths:
      - 'tools/loop-quantization-sim/**'
      - '.github/workflows/test-loop-sim.yml'
  pull_request:
    paths:
      - 'tools/loop-quantization-sim/**'
      - '.github/workflows/test-loop-sim.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node version
        run: node --version

      - name: Smoketest
        run: node tools/loop-quantization-sim/smoketest.js

      - name: Two-device Link sync
        run: node tools/loop-quantization-sim/two-device-sync.js

      - name: Remote transport join
        run: node tools/loop-quantization-sim/remote-join.js

      - name: Late join after standalone take
        run: node tools/loop-quantization-sim/join-late.js

      - name: Master length lands before beat count
        run: node tools/loop-quantization-sim/beat-count-race.js

      - name: Read head tracks the shared grid
        run: node tools/loop-quantization-sim/read-head-lineup.js

      - name: Retune after recording
        run: node tools/loop-quantization-sim/tempo-change.js

      - name: Link dropout and reconnect
        run: node tools/loop-quantization-sim/dropout.js

      - name: Arm on a fine-grid boundary
        run: node tools/loop-quantization-sim/arm-boundary.js

      - name: Mismatched master lengths
        run: node tools/loop-quantization-sim/mismatched-masters.js

      - name: Take recorded at a drifted tempo
        run: node tools/loop-quantization-sim/tempo-drift-take.js

      - name: Fuzz
        run: node tools/loop-quantization-sim/fuzz.js --trials=3000 --events=50
