name: test-loop-sim

on:
  push:
    paths:
      - 'tools/loop-quantization-sim/**'
      - 'tools/ci-contract-check.js'
      - 'dsp/loop.dsp'
      - 'src/dsp/audio_thread.cpp'
      - 'src/control/apc_grid.cpp'
      - 'src/control/apc_grid.h'
      - 'src/link/**'
      - '.github/workflows/test-loop-sim.yml'
  pull_request:
    paths:
      - 'tools/loop-quantization-sim/**'
      - 'tools/ci-contract-check.js'
      - 'dsp/loop.dsp'
      - 'src/dsp/audio_thread.cpp'
      - 'src/control/apc_grid.cpp'
      - 'src/control/apc_grid.h'
      - 'src/link/**'
      - '.github/workflows/test-loop-sim.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node version
        run: node --version

      - name: Smoketest
        run: node tools/loop-quantization-sim/smoketest.js

      - name: Two-device Link sync
        run: node tools/loop-quantization-sim/two-device-sync.js

      - name: Remote transport join
        run: node tools/loop-quantization-sim/remote-join.js

      - name: Late join after standalone take
        run: node tools/loop-quantization-sim/join-late.js

      - name: Master length lands before beat count
        run: node tools/loop-quantization-sim/beat-count-race.js

      - name: Read head tracks the shared grid
        run: node tools/loop-quantization-sim/read-head-lineup.js

      - name: Non-divisor take wraps seamlessly at the master downbeat
        run: node tools/loop-quantization-sim/non-divisor-wrap.js

      - name: Clear resets the device to startup defaults
        run: node tools/loop-quantization-sim/clear-reset-defaults.js

      - name: Retune after recording
        run: node tools/loop-quantization-sim/tempo-change.js

      - name: Link dropout and reconnect
        run: node tools/loop-quantization-sim/dropout.js

      - name: Arm on a fine-grid boundary
        run: node tools/loop-quantization-sim/arm-boundary.js

      - name: Mismatched master lengths
        run: node tools/loop-quantization-sim/mismatched-masters.js

      - name: Take recorded at a drifted tempo
        run: node tools/loop-quantization-sim/tempo-drift-take.js

      - name: Long take lands on the phrase grid
        run: node tools/loop-quantization-sim/long-take-quantize.js

      - name: Varispeed punch stays baked in the take
        run: node tools/loop-quantization-sim/varispeed-record.js

      - name: First take owns the session tempo
        run: node tools/loop-quantization-sim/first-loop-tempo-owner.js

      - name: Takes latch the tempo ratio, never the phase trim
        run: node tools/loop-quantization-sim/two-take-rate-lock.js

      - name: First take phrase turnaround sits one loop before the press
        run: node tools/loop-quantization-sim/first-take-phrase-offset.js

      - name: First take origin on the record-press sample
        run: node tools/loop-quantization-sim/first-take-origin.js

      - name: Join race holds a stale peer count at the tempo gate
        run: node tools/loop-quantization-sim/join-race-tempo-authority.js

      - name: CI workflow contract
        run: node tools/ci-contract-check.js

      - name: Empty slave adopts the peer origin and keeps it
        run: node tools/loop-quantization-sim/empty-slave-adopt.js

      - name: Resample backdate tracks the measured fold latency
        run: node tools/loop-quantization-sim/resample-backdate.js

      - name: Resample impulse lands on the master grid
        run: node tools/loop-quantization-sim/resample-impulse-landing.js

      - name: Fold error on the 128-quantum capture
        run: node tools/loop-quantization-sim/loop-quantum-fold.js

      - name: 128-beat phase capture folds at the loop quantum for rb=3/5/6/7
        run: node tools/loop-quantization-sim/phase-capture-128-fold.js

      - name: Rebase keeps the 128-beat phase capture on the loop grid at rb=3/5/6/7
        run: node tools/loop-quantization-sim/phase-capture-128-rebase.js

      - name: Shipped C++ captures phase at the loop quantum
        run: node tools/loop-quantization-sim/device-loop-quantum-capture.js

      - name: Visual beat cue software send stays on the Link beat grid
        run: node tools/loop-quantization-sim/visual-beat-cue.js

      - name: Visual beat cue +20 ms negative control must fail
        run: |
          if node tools/loop-quantization-sim/visual-beat-cue.js --control; then
            echo "negative control unexpectedly passed"
            exit 1
          fi
          node tools/loop-quantization-sim/visual-beat-cue.js --assert-control

      - name: Backwards phrase rebase does not emit a false boundary under the shipped ESP guard
        run: node tools/loop-quantization-sim/phrase-rebase-backwards.js

      - name: Backwards phrase rebase no-fix control must fail
        run: |
          if node tools/loop-quantization-sim/phrase-rebase-backwards.js --no-fix; then
            echo "negative control unexpectedly passed"
            exit 1
          fi
          node tools/loop-quantization-sim/phrase-rebase-backwards.js --no-fix --assert-control

      - name: Fuzz
        run: node tools/loop-quantization-sim/fuzz.js --trials=3000 --events=50
