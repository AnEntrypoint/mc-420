name: witness-summary

on:
  push:
    paths:
      - tools/witness-summary/**
      - .github/workflows/witness-summary.yml
  workflow_dispatch:

jobs:
  summarise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax
        run: node --check tools/witness-summary/summarise.mjs
      - name: NOT DETECTED keeps its own verdict
        run: |
          printf '%s\n' '[loopback-witness] LOCK note=60 expect 261.63 Hz measured NOT DETECTED (seg rms 0.012000 silent rms 0.000100 peak 0.030000)' > "$RUNNER_TEMP/nd.txt"
          node tools/witness-summary/summarise.mjs --json "$RUNNER_TEMP/nd.txt" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.verdict!=="NOT_DETECTED"){console.error("verdict "+r.verdict);process.exit(1)}console.log("verdict "+r.verdict)})'
      - name: INVALID keeps its own verdict
        run: |
          printf '%s\n' '[loopback-witness] LOCK note=62 expect 293.66 Hz INVALID (seg rms 0.000100 silent rms 0.000090 0.9 dB over silent, need 10 dB, 3 valid hops): no measurement' > "$RUNNER_TEMP/inv.txt"
          node tools/witness-summary/summarise.mjs --json "$RUNNER_TEMP/inv.txt" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.verdict!=="INVALID"){console.error("verdict "+r.verdict);process.exit(1)}console.log("verdict "+r.verdict)})'
      - name: Octave jump count is parsed
        run: |
          printf '%s\n' '[loopback-witness] octave jumps in first 2s: 2 [t=300ms 500ms] of 20 valid hops' > "$RUNNER_TEMP/jumps.txt"
          node tools/witness-summary/summarise.mjs --json "$RUNNER_TEMP/jumps.txt" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.octave_jumps!==2||r.valid_hops!==20){console.error(JSON.stringify(r));process.exit(1)}console.log("octave_jumps "+r.octave_jumps)})'
      - name: A one-sample phase spike is not a persistent excursion
        run: |
          printf '%s\n' '1792768968000 1 true 120 0 1' '1792768969000 1 true 120 0 1' '1792768970000 1 true 120 0.151 1' '1792768971000 1 true 120 0 1' > "$RUNNER_TEMP/spike.txt"
          printf '%s\n' '1792768968000 1 true 120 0 1' '1792768969000 1 true 120 0.151 1' '1792768970000 1 true 120 0.160 1' '1792768971000 1 true 120 0 1' > "$RUNNER_TEMP/run2.txt"
          node tools/witness-summary/summarise.mjs --json "$RUNNER_TEMP/spike.txt" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.phase_err_max!==0.151||r.phase_err_persistent!==0){console.error(JSON.stringify(r));process.exit(1)}console.log("spike max "+r.phase_err_max+" persistent "+r.phase_err_persistent)})'
          node tools/witness-summary/summarise.mjs --json "$RUNNER_TEMP/run2.txt" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.phase_err_max!==0.16||r.phase_err_persistent!==1){console.error(JSON.stringify(r));process.exit(1)}console.log("run max "+r.phase_err_max+" persistent "+r.phase_err_persistent)})'
