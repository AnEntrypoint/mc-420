name: diag-x86-codegen

on:
  workflow_dispatch:

jobs:
  time-faust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        name: [shipped, probeonly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Faust
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y faust lv2-dev pkg-config build-essential libboost-dev

      - name: Pick the variant
        run: |
          python3 - <<'PY'
          import io
          src = io.open('effects/pitchtracker-src/pitchtracker_ac.dsp', encoding='utf-8').read()
          cut = src.index('process(sig) = holdLastGood(')
          probe = src[:cut] + 'process(x) = detectedFreq(x) : (_, !) : max(minTrackHz) : min(maxTrackHz);\n'
          io.open('/tmp/shipped.dsp', 'w', encoding='utf-8', newline='\n').write(src)
          io.open('/tmp/probeonly.dsp', 'w', encoding='utf-8', newline='\n').write(probe)
          PY

      - name: Codegen ${{ matrix.name }} on x86_64
        timeout-minutes: 20
        run: |
          set +e
          FAUSTLIB=$(dirname "$(ls -f /usr/share/faust/lv2ui.cpp /usr/local/share/faust/lv2ui.cpp 2>/dev/null | tail -1)")
          faust --version
          start=$(date +%s%N)
          faust -i -a "$FAUSTLIB/lv2.cpp" -vec -fun -dfs -vs 32 -nvi -ct 0 -cn probe \
            "/tmp/${{ matrix.name }}.dsp" -o /tmp/probe.cpp
          rc=$?
          end=$(date +%s%N)
          secs=$(awk "BEGIN{printf \"%.1f\", ($end-$start)/1000000000}")
          size=$(stat -c %s /tmp/probe.cpp 2>/dev/null || echo 0)
          echo "RESULT x86 ${{ matrix.name }}: rc=$rc seconds=$secs cppBytes=$size"
