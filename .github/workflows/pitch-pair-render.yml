name: pitch-pair-render

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [base1500, base1500-tau01, ceil2600, ceil2600-tau01, b3-1500, b3-1500-tau01]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Faust and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y faust
          pip install numpy

      - name: Build the six pinned variants from the base sha
        run: |
          set -e
          mkdir -p work/variants
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, sys
          BASE_SHA = "cea5e4f00533f0364bfd7eb9f62e851029ee9a1301b4ba8566d0c5dc7f4d67e0"
          base = subprocess.run(["git", "show", "47d0af89:effects/pitchtracker-src/pitchtracker_ac.dsp"], check=True, capture_output=True).stdout
          if hashlib.sha256(base).hexdigest() != BASE_SHA:
              sys.exit("base sha256 differs from the pre-registered cea5e4f0")
          def once(text, old, new):
              n = text.count(old)
              if n != 1:
                  sys.exit(f"edit target occurs {n} times: {old!r}")
              return text.replace(old, new)
          def tau_f(text):
              return once(text, "ba.if(freqHz >= 575.0, 0.02,", "ba.if(freqHz >= 575.0, 0.01,")
          text = base.decode()
          e1 = once(text, "maxTrackHz = 1500.0;", "maxTrackHz = 2600.0;")
          e2 = once(e1, "subharmDominanceMargin = 0.004;", "subharmDominanceMargin = 0.004;\npromoteMargin = 0.001;")
          pair = once(once(e2, "(raw3 > pBase + subharmDominanceMargin)", "(raw3 > pBase + promoteMargin)"), "(raw2 > pBase + subharmDominanceMargin)", "(raw2 > pBase + promoteMargin)")
          if pair.encode() != pathlib.Path("effects/pitchtracker-src/pitchtracker_ac.dsp").read_bytes():
              sys.exit("the shipped DSP differs from the registered pair P")
          b3 = once(pair, "maxTrackHz = 2600.0;", "maxTrackHz = 1500.0;")
          variants = {"base1500": text, "base1500-tau01": tau_f(text), "ceil2600": pair, "ceil2600-tau01": tau_f(pair), "b3-1500": b3, "b3-1500-tau01": tau_f(b3)}
          for name, body in variants.items():
              pathlib.Path("work/variants/" + name + ".dsp").write_text(body)
              print(name, hashlib.sha256(body.encode()).hexdigest())
          PY
          test -s work/variants/${{ matrix.variant }}.dsp

      - name: Generate the Faust codegen and build the renderer
        timeout-minutes: 45
        run: |
          set -e
          faust -i -a tools/pitchtracker-render/pt_arch.cpp -vec -fun -dfs -vs 32 -nvi -ct 0 -t 600 -cn pitchtracker work/variants/${{ matrix.variant }}.dsp -o work/pt_dsp.cpp
          g++ -O3 -std=c++17 -I work -o pt_render tools/pitchtracker-render/pt_render.cpp -lm

      - name: Build the corpus with the sine inputs
        run: |
          set -e
          mkdir -p work/corpus
          cp test-audio-corpus/instruments/*.wav work/corpus/
          python3 tools/ceiling-dedup/make_sines.py work/sines
          cp work/sines/*.wav work/corpus/
          python3 -c 'import math,struct,wave; SR=48000; w=wave.open("work/corpus/sine_2093.wav","wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR); w.writeframes(b"".join(struct.pack("<h", round(0.3*math.sin(2*math.pi*2093.005*i/SR)*32767)) for i in range(3*SR))); w.close()'
          node tools/corpus-level/normalise-corpus.mjs --src work/corpus --out work/normalised --rms 0.1

      - name: Render the corpus through the variant
        run: |
          python3 tools/pitchtracker-render/render_corpus.py --render ./pt_render --corpus work/normalised --reference docs/witness/corpus-pitch-reference.md --variant ${{ matrix.variant }} --out render-out

      - name: Upload the settled table and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt-pair-${{ matrix.variant }}
          path: render-out
          if-no-files-found: error
          retention-days: 14
