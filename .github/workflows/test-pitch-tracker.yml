name: test-pitch-tracker

on:
  push:
    paths:
      - 'effects/home/faust/multitranspose.dsp'
      - 'effects/pitchtracker-src/**'
      - 'test/pitch-tracker-transient/**'
      - 'effects/home/faust/soladSnacOctaver.h'
      - 'effects/home/faust/grainFormant.h'
      - 'tools/formant-lab/**'
      - 'tools/dsp-cli/dsp_cli.cpp'
      - 'tools/dsp-cli/dsp_generated.cpp'
      - 'tools/corpus-pitch-metric/**'
      - 'docs/witness/corpus-pitch-reference.md'
      - '.github/workflows/test-pitch-tracker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multitranspose-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install numpy

      - name: Build dsp_cli from the committed Faust codegen
        run: |
          g++ --version | head -1
          g++ -O2 -std=c++17 -I tools/dsp-cli -I effects/home/faust \
            -o dsp_cli tools/dsp-cli/dsp_cli.cpp -lm
          ./dsp_cli --list-zones

      - name: ensure audio corpus
        run: |
          if [ ! -f test-audio-corpus/instruments/piano_mid_C4.wav ]; then
            python3 tools/chain-render/make_corpus.py test-audio-corpus/instruments
          fi

      - name: Build the formant meter
        run: g++ -O2 -std=c++17 -o formant_meter tools/formant-lab/formant_meter.cpp -lm

      - name: Measure the vocoder/formant layer over the corpus
        run: |
          python3 tools/formant-lab/measure-formant.py \
            --dsp-cli ./dsp_cli --meter ./formant_meter \
            --enforce authority,am,see,ripple,lmedian

      - name: Run interval-harmonizer onset accuracy check
        run: python3 test/pitch-tracker-transient/verify_highoctave_transient.py

      - name: Run plosive/mid-sustain-burst regression check
        run: python3 test/pitch-tracker-transient/verify_plosive_transient.py

      - name: Run chord correctness + voice-steal click-safety check
        run: python3 test/pitch-tracker-transient/verify_chord_and_voice_steal.py

      - name: Run formant vocal-morph control check
        run: python3 test/pitch-tracker-transient/verify_formant_morph.py

      - name: Run voice-as-bass diagnostic (non-blocking)
        run: python3 test/pitch-tracker-transient/verify_voice_as_bass.py

  corpus-pitch-metric:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dsp_cli from the committed Faust codegen
        run: g++ -O2 -std=c++17 -I tools/dsp-cli -I effects/home/faust -o dsp_cli tools/dsp-cli/dsp_cli.cpp -lm -lpthread

      - name: Without thresholds no number is printed
        run: |
          set +e
          out=$(node tools/corpus-pitch-metric/measure.mjs --corpus test-audio-corpus/instruments --dsp-cli "$PWD/dsp_cli" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then printf '%s\n' "$out"; exit 1; fi
          if printf '%s' "$out" | grep -Eq '[0-9]+\.[0-9]+'; then
            printf '%s\n' "$out"
            echo "a measurement was printed before thresholds were supplied"
            exit 1
          fi
          echo "refused with exit 2 and no measurement printed"

      - name: Measure the corpus against its measured peaks
        run: |
          node tools/corpus-pitch-metric/measure.mjs \
            --corpus test-audio-corpus/instruments \
            --dsp-cli "$PWD/dsp_cli" \
            --thresholds tools/corpus-pitch-metric/thresholds.json \
            --baseline tools/corpus-pitch-metric/baseline.json \
            --out corpus-pitch-metric.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-pitch-metric
          path: corpus-pitch-metric.json
          if-no-files-found: error
          retention-days: 14

  pitchtracker-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install faust + numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y faust
          pip install numpy

      - name: Run pitchtracker_ac.dsp steady-state accuracy check
        run: python3 test/pitch-tracker-transient/verify_ac_tracker_steadystate_bias.py

      - name: Measure octave stability under a timbre shift
        run: python3 test/pitch-tracker-transient/verify_ac_tracker_timbre_shift.py

      - name: Diagnose isolated floor-estimator convergence (no main lowpass loop)
        run: python3 test/pitch-tracker-transient/diag_isolate_floor.py

      - name: Trace main-loop y trajectory (baseline vs frequency-scaled main tracker)
        run: python3 test/pitch-tracker-transient/diag_trace_main_loop.py

  pitchtracker-render:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [base, coarse-gate, energy-norm, corr-tau-0.02]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Faust and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y faust
          pip install numpy

      - name: Restore the variant Faust cache
        uses: actions/cache@v4
        with:
          path: /tmp/ptrender-cache
          key: faust-pt-render-v1-${{ matrix.variant }}-${{ hashFiles('effects/pitchtracker-src/pitchtracker_ac.dsp', 'tools/pitchtracker-render/pt_arch.cpp', 'tools/pitchtracker-render/variants.py') }}

      - name: Generate the variant Faust codegen and build the renderer
        timeout-minutes: 30
        run: |
          set -e
          mkdir -p /tmp/ptrender-cache work
          if [ ! -s /tmp/ptrender-cache/pt_dsp.cpp ]; then
            python3 tools/pitchtracker-render/variants.py ${{ matrix.variant }} effects/pitchtracker-src/pitchtracker_ac.dsp work/pitchtracker_${{ matrix.variant }}.dsp
            faust -i -a tools/pitchtracker-render/pt_arch.cpp -vec -fun -dfs -vs 32 -nvi -ct 0 -t 600 -cn pitchtracker work/pitchtracker_${{ matrix.variant }}.dsp -o /tmp/ptrender-cache/pt_dsp.cpp
          fi
          g++ -O2 -std=c++17 -I /tmp/ptrender-cache -o pt_render tools/pitchtracker-render/pt_render.cpp -lm

      - name: Level-normalise the corpus for the render
        run: |
          node tools/corpus-level/normalise-corpus.mjs --src test-audio-corpus/instruments --out work/normalised --rms 0.1

      - name: Render the corpus through the variant
        run: |
          python3 tools/pitchtracker-render/render_corpus.py \
            --render ./pt_render \
            --corpus work/normalised \
            --reference docs/witness/corpus-pitch-reference.md \
            --variant ${{ matrix.variant }} \
            --out render-out

      - name: Upload the settled table and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt-render-${{ matrix.variant }}
          path: render-out
          if-no-files-found: error
          retention-days: 14
