name: build-image

on:
  workflow_run:
    workflows: ["build-binary"]
    types: [completed]
  push:
    paths:
      - 'image/**'
      - 'kernel/**'
      - 'src/**'
      - 'dsp/**'
      - 'config/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alpine-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        board: [pi3, pi4, pi5]
    steps:
      - uses: actions/checkout@v4

      - name: Tools (mtools, dosfstools, fdisk, e2fsprogs, xz, u-boot-tools, file — image assembly)
        run: sudo apt-get update && sudo apt-get install -y mtools dosfstools fdisk e2fsprogs xz-utils util-linux u-boot-tools curl gzip file zip

      - name: Download aloop binary + LV2 bundles from their latest green runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl/bin dl/lv2
          BIN_RUN=$(gh run list --workflow build-binary.yml --status success \
                    --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          LV2_RUN=$(gh run list --workflow build-lv2.yml --status success \
                    --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          echo "binary run: ${BIN_RUN:-none}   lv2 run: ${LV2_RUN:-none}"
          [ -n "$BIN_RUN" ] && gh run download "$BIN_RUN" -n aloop-aarch64-musl -D dl/bin || echo "no binary artifact yet"
          [ -n "$LV2_RUN" ] && gh run download "$LV2_RUN" -n home-fx-lv2 -D dl/lv2/home-fx-lv2 || echo "no home-fx-lv2 artifact yet"
          [ -n "$LV2_RUN" ] && gh run download "$LV2_RUN" -n guitar-lofi-fx-lv2 -D dl/lv2/guitar-lofi-fx-lv2 || echo "no guitar-lofi-fx-lv2 artifact yet"
          mkdir -p dl/resonode
          [ -n "$LV2_RUN" ] && gh run download "$LV2_RUN" -n resonode-lv2 -D dl/resonode || echo "no resonode-lv2 artifact yet"
          mkdir -p dl/pitchtracker
          [ -n "$LV2_RUN" ] && gh run download "$LV2_RUN" -n pitchtracker-lv2 -D dl/pitchtracker || echo "no pitchtracker-lv2 artifact yet"
          mkdir -p dl/delayverb
          [ -n "$LV2_RUN" ] && gh run download "$LV2_RUN" -n delayverb-lv2 -D dl/delayverb || echo "no delayverb-lv2 artifact yet"
          find dl -type f | head -20

      - name: Locate payload
        id: payload
        run: |
          BIN=$(find dl/bin -type f -name aloop 2>/dev/null | head -n1 || true)
          LV2DIR=""; [ -d dl/lv2 ] && [ -n "$(find dl/lv2 -maxdepth 2 -name '*.lv2' -type d 2>/dev/null)" ] && LV2DIR="dl/lv2"
          RESONODEDIR=""; [ -d dl/resonode ] && [ -n "$(find dl/resonode -maxdepth 2 -name 'resonode.lv2' -type d 2>/dev/null)" ] && RESONODEDIR="dl/resonode"
          PITCHTRACKERDIR=""; [ -d dl/pitchtracker ] && [ -n "$(find dl/pitchtracker -maxdepth 2 -name 'pitchtracker.lv2' -type d 2>/dev/null)" ] && PITCHTRACKERDIR="dl/pitchtracker"
          DELAYVERBDIR=""; [ -d dl/delayverb ] && [ -n "$(find dl/delayverb -maxdepth 2 -name 'delayverb.lv2' -type d 2>/dev/null)" ] && DELAYVERBDIR="dl/delayverb"
          echo "bin=$BIN"   >> "$GITHUB_OUTPUT"
          echo "lv2dir=$LV2DIR" >> "$GITHUB_OUTPUT"
          echo "resonodedir=$RESONODEDIR" >> "$GITHUB_OUTPUT"
          echo "pitchtrackerdir=$PITCHTRACKERDIR" >> "$GITHUB_OUTPUT"
          echo "delayverbdir=$DELAYVERBDIR" >> "$GITHUB_OUTPUT"
          echo "found binary: '${BIN:-<none>}'  lv2 dir: '${LV2DIR:-<none>}'  resonode dir: '${RESONODEDIR:-<none>}'  pitchtracker dir: '${PITCHTRACKERDIR:-<none>}'  delayverb dir: '${DELAYVERBDIR:-<none>}'"
          find dl/lv2 -maxdepth 2 -name '*.lv2' -type d 2>/dev/null
          find dl/resonode -maxdepth 2 -name 'resonode.lv2' -type d 2>/dev/null
          find dl/pitchtracker -maxdepth 2 -name 'pitchtracker.lv2' -type d 2>/dev/null
          find dl/delayverb -maxdepth 2 -name 'delayverb.lv2' -type d 2>/dev/null

      - name: Build the flashable image (image/build-image.sh)
        env:
          ALOOP_BIN: ${{ steps.payload.outputs.bin }}
          LV2_DIR: ${{ steps.payload.outputs.lv2dir }}
          RESONODE_LV2_DIR: ${{ steps.payload.outputs.resonodedir }}
          PITCHTRACKER_LV2_DIR: ${{ steps.payload.outputs.pitchtrackerdir }}
          DELAYVERB_LV2_DIR: ${{ steps.payload.outputs.delayverbdir }}
          BOARD: ${{ matrix.board }}
          OUT: aloop-${{ matrix.board }}.img
        run: |
          chmod +x image/build-image.sh
          image/build-image.sh
          gzip -9 -k aloop-${{ matrix.board }}.img
          ls -la aloop-${{ matrix.board }}.img aloop-${{ matrix.board }}.img.gz

      - name: Validate the image without a Pi (partition + boot files + overlay)
        env:
          BOARD: ${{ matrix.board }}
        run: |
          chmod +x image/validate-image.sh
          image/validate-image.sh aloop-${{ matrix.board }}.img

      - name: Build + validate the TFTP netboot root
        if: matrix.board != 'opi-prime'
        env:
          ALOOP_BIN: ${{ steps.payload.outputs.bin }}
          LV2_DIR: ${{ steps.payload.outputs.lv2dir }}
          RESONODE_LV2_DIR: ${{ steps.payload.outputs.resonodedir }}
          PITCHTRACKER_LV2_DIR: ${{ steps.payload.outputs.pitchtrackerdir }}
          DELAYVERB_LV2_DIR: ${{ steps.payload.outputs.delayverbdir }}
          BOARD: ${{ matrix.board }}
          OUT: aloop-netboot-${{ matrix.board }}
        run: |
          chmod +x image/build-netboot.sh image/validate-netboot.sh
          image/build-netboot.sh
          image/validate-netboot.sh aloop-netboot-${{ matrix.board }}
          tar -czf aloop-netboot-${{ matrix.board }}.tar.gz aloop-netboot-${{ matrix.board }}
          ls -la aloop-netboot-${{ matrix.board }}.tar.gz

      - name: Upload flashable image
        uses: actions/upload-artifact@v4
        with:
          name: aloop-${{ matrix.board }}-image
          path: aloop-${{ matrix.board }}.img.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload netboot root
        if: matrix.board != 'opi-prime'
        uses: actions/upload-artifact@v4
        with:
          name: aloop-${{ matrix.board }}-netboot-root
          path: aloop-netboot-${{ matrix.board }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Extract SD boot tree from the validated image and zip it
        if: matrix.board != 'opi-prime'
        run: |
          OFF=$((2048 * 512))
          MT=$(mktemp)
          printf 'drive z: file="%s/aloop-%s.img" offset=%s\n' "$PWD" "${{ matrix.board }}" "$OFF" > "$MT"
          export MTOOLSRC="$MT"
          rm -rf sd-boot-tree
          mkdir -p sd-boot-tree
          mcopy -s z:/ sd-boot-tree/
          ls -la sd-boot-tree | head -20
          (cd sd-boot-tree && zip -r -9 -q ../aloop-${{ matrix.board }}-sdcard.zip .)
          ls -la aloop-${{ matrix.board }}-sdcard.zip

      - name: Upload SD card zip
        if: matrix.board != 'opi-prime'
        uses: actions/upload-artifact@v4
        with:
          name: aloop-${{ matrix.board }}-sdcard
          path: aloop-${{ matrix.board }}-sdcard.zip
          if-no-files-found: error
          retention-days: 3

      - name: Assert the image actually carries a real payload before releasing
        id: payload_check
        run: |
          if [ -z "${{ steps.payload.outputs.bin }}" ]; then
            echo "no aloop binary was found this run -- refusing to publish a payload-less release" >&2
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_payload=true" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      has_payload: ${{ steps.payload_check.outputs.has_payload }}

  release:
    needs: alpine-image
    if: |
      needs.alpine-image.outputs.has_payload == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download every board's image + SD card zip
        uses: actions/download-artifact@v4
        with:
          pattern: aloop-*-image
          path: dl
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: aloop-*-sdcard
          path: dl
          merge-multiple: true
      - name: List gathered release assets
        run: ls -la dl/

      - name: Publish rolling "latest" GitHub Release with every board's images
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: aloop latest (auto-updated on every green main build)
          body: |
            Automatically rebuilt SD card images on every successful push to `main`.
            Commit: ${{ github.sha }}

            One image per supported board — flash the one matching your hardware.

            **aloop-<board>-sdcard.zip** — extract onto a freshly-formatted FAT32 SD card
            (firmware + kernel + DTBs + apkovl + config, ready to boot).

            **aloop-<board>.img.gz** — raw dd-able image (`dd if=aloop-<board>.img of=/dev/sdX bs=4M conv=fsync`
            after `gunzip`, or Raspberry Pi Imager / balenaEtcher).

            Supported boards this release: pi3, pi4, pi5 (SD card zip + raw image),
            opi-prime (Orange Pi Prime, Allwinner H5 — raw `dd`-able image only,
            no SD card zip: its boot layout is raw U-Boot sectors + an ext4 root
            partition, not a single FAT partition, so there's no "format+extract"
            flow to offer for it).
          prerelease: true
          make_latest: true
          files: |
            dl/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
