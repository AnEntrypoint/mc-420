name: pitch-2093-render

on:
  push:
    paths:
      - 'docs/witness/pitch-2093/**'
      - 'effects/pitchtracker-src/pitchtracker_ac.dsp'
      - 'tools/pitchtracker-render/**'
      - 'tools/ceiling-dedup/make_sines.py'
      - '.github/workflows/pitch-2093-render.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [base, gated, gated-tau01, v2, v2-tau01]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Faust and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y faust
          pip install numpy

      - name: Prepare the variant source
        run: |
          set -e
          mkdir -p work
          case "${{ matrix.variant }}" in
            base) cp effects/pitchtracker-src/pitchtracker_ac.dsp work/variant.dsp ;;
            cand) cp docs/witness/pitch-2093/pitchtracker_ac_2093.dsp work/variant.dsp ;;
            cand-tau01) sed -e 's/ba.if(freqHz >= 575.0, 0.02,/ba.if(freqHz >= 575.0, 0.01,/' -e 's/lagFor(f), 0.02);/lagFor(f), 0.01);/' docs/witness/pitch-2093/pitchtracker_ac_2093.dsp > work/variant.dsp ;;
            gated) cp docs/witness/pitch-2093/pitchtracker_ac_2093g.dsp work/variant.dsp ;;
            gated-tau01) sed -e 's/ba.if(freqHz >= 575.0, 0.02,/ba.if(freqHz >= 575.0, 0.01,/' -e 's/lagFor(f), 0.02);/lagFor(f), 0.01);/' -e 's/lagFor(2.0 \* f), 0.02)/lagFor(2.0 * f), 0.01)/' docs/witness/pitch-2093/pitchtracker_ac_2093g.dsp > work/variant.dsp ;;
            v2) cp docs/witness/pitch-2093/pitchtracker_ac_2093v2.dsp work/variant.dsp ;;
            v2-tau01) sed -e 's/ba.if(freqHz >= 575.0, 0.02,/ba.if(freqHz >= 575.0, 0.01,/' -e 's/lagFor(f), 0.02);/lagFor(f), 0.01);/' -e 's/lagFor(2.0 \* f), 0.02)/lagFor(2.0 * f), 0.01)/' docs/witness/pitch-2093/pitchtracker_ac_2093v2.dsp > work/variant.dsp ;;
          esac
          test -s work/variant.dsp

      - name: Generate the Faust codegen and build the renderer
        timeout-minutes: 45
        run: |
          set -e
          faust -i -a tools/pitchtracker-render/pt_arch.cpp -vec -fun -dfs -vs 32 -nvi -ct 0 -t 600 -cn pitchtracker work/variant.dsp -o work/pt_dsp.cpp
          g++ -O2 -std=c++17 -I work -o pt_render tools/pitchtracker-render/pt_render.cpp -lm

      - name: Build the corpus with the sine inputs
        run: |
          set -e
          mkdir -p work/corpus
          cp test-audio-corpus/instruments/*.wav work/corpus/
          python3 tools/ceiling-dedup/make_sines.py work/sines
          cp work/sines/*.wav work/corpus/
          python3 -c 'import math,struct,wave; SR=48000; w=wave.open("work/corpus/sine_2093.wav","wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR); w.writeframes(b"".join(struct.pack("<h", round(0.3*math.sin(2*math.pi*2093.005*i/SR)*32767)) for i in range(3*SR))); w.close()'
          node tools/corpus-level/normalise-corpus.mjs --src work/corpus --out work/normalised --rms 0.1

      - name: Render the corpus through the variant
        run: |
          python3 tools/pitchtracker-render/render_corpus.py --render ./pt_render --corpus work/normalised --reference docs/witness/corpus-pitch-reference.md --variant ${{ matrix.variant }} --out render-out

      - name: Upload the settled table and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt-2093-${{ matrix.variant }}
          path: render-out
          if-no-files-found: error
          retention-days: 14
