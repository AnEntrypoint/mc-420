name: test-status-fields

on:
  push:
    paths:
      - 'test/status-fields-verify/**'
      - 'test/hardware/link-mesh-status.js'
      - 'test/hardware/verify-two-device-sync.js'
      - 'test/hardware/verify-quantization.js'
      - 'test/hardware/verify-transport-stays-running.js'
      - 'test/hardware/verify-peer-follows-loop.js'
      - 'src/control/telemetry.cpp'
      - 'src/link/link_bridge.cpp'
      - 'src/dsp/audio_thread.cpp'
      - 'docs/LINK-MESH-TESTING.md'
      - 'docs/DECISIONS.md'
      - '.github/workflows/test-status-fields.yml'
  workflow_dispatch:
    inputs:
      run_device_verifiers:
        description: 'Run the four device-only phrase verifiers against the mesh'
        required: false
        default: false
        type: boolean
      device_host:
        description: 'Pi host passed to the four device-only verifiers'
        required: false
        default: '192.168.137.132'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Recorded status replies, positive control
        run: node test/status-fields-verify/verify-status-fields.js
      - name: Positive and negative controls
        run: node test/status-fields-verify/run-controls.js

  hardware-verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Four device-only verifier names and gate
        run: node test/status-fields-verify/check-hardware-verifier-names.js
      - name: Device-only phrase verifiers, gated
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device_verifiers == true }}
        run: |
          node test/hardware/verify-two-device-sync.js ${{ inputs.device_host }} 600000
          node test/hardware/verify-quantization.js ${{ inputs.device_host }}
          node test/hardware/verify-transport-stays-running.js ${{ inputs.device_host }}
          node test/hardware/verify-peer-follows-loop.js ${{ inputs.device_host }}
