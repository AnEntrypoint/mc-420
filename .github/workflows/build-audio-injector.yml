name: build-audio-injector

on:
  push:
    paths:
      - 'test/hardware/audio-injector.c'
      - '.github/workflows/build-audio-injector.yml'
  pull_request:
    paths:
      - 'test/hardware/audio-injector.c'
      - '.github/workflows/build-audio-injector.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-injector-aarch64-musl:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build musl-static aarch64 ALSA writer in an Alpine aarch64 container
        timeout-minutes: 25
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/w -w /w alpine:3.20 sh -c '
            set -ex
            timeout 400 apk add --no-cache build-base tar bzip2 file wget linux-headers
            gcc --version | head -1
            for v in 1.2.12 1.2.11; do
              if wget -q "https://www.alsa-project.org/files/pub/lib/alsa-lib-$v.tar.bz2"; then
                echo "ALSA_LIB_VERSION=$v"
                break
              fi
            done
            tar xjf alsa-lib-*.tar.bz2
            cd alsa-lib-*
            ./configure --prefix=/usr/local --enable-static --disable-shared --disable-python
            make -j"$(nproc)"
            make install
            cd /w
            ls -l /usr/local/lib/libasound.a
            gcc -O2 -std=c11 -Wall -Wextra -I/usr/local/include -static \
              -o audio-injector test/hardware/audio-injector.c \
              /usr/local/lib/libasound.a -lm -ldl -lpthread
            file audio-injector
            ldd audio-injector 2>&1 || true
            ls -la audio-injector
          '

      - name: Upload audio-injector
        uses: actions/upload-artifact@v4
        with:
          name: audio-injector-aarch64-musl
          path: audio-injector
          retention-days: 3
