- id: pitch-tracker-main-tracker-regression-real-cause
  status: witnessed
  description: 'Verified via faustlibraries filters.lib source: lptau(tN,x)=lptN(8.6858896381,tN,x)=x:si.smooth(ba.tau2pole(tN/log(10^(8.6858896381/20)))) -- and 8.6858896381/20*ln(10) computes to exactly 1.0 by construction (that magic constant IS chosen so the log-scaling factor is unity), so an.zcr(tau,x) reduces EXACTLY to ma.zc(x):si.smooth(ba.tau2pole(tau)), functionally identical to onePoleZc''s own ma.zc(x)*(1-pole)+prev*pole with pole=ba.tau2pole(tau) at any FIXED tau. This CONTRADICTS the earlier resolution of pitch-tracker-fix-insufficient-need-main-tau-scaling, which incorrectly attributed the main-tracker regression (82Hz: 115.3->348.8 cents, 880Hz: 121.7->259.3 cents, CI run 31307150451) to a formula mismatch between si.smooth''s internal recursion shape and onePoleZc''s hand-written recursion -- both ARE the same recursion shape (fb(y)=(1-s)*x+s*y is exactly si.smooth''s own smooth_imp case 0 branch). The real cause must be something else: either (a) the main loop''s an.zcr(t, fi.lowpass(N,cutoff,xHighpassed)) call operates on an ALREADY-lowpass-filtered signal (fi.lowpass(N=trackerHarmonics=4,cutoff,...)) whereas onePoleZc''s coarse/fast floor calls operate on raw xHighpassed with no lowpass stage -- a 4-pole lowpass filter has its own settling-time/phase-delay behavior that could interact badly with a frequency-scaled pole change happening EVERY sample (the coefficient itself is now signal-dependent, not fixed, inside a loop that ALSO has fi.lowpass''s own state), or (b) making the main loop''s OWN convergence speed depend on y (its own output) creates a feedback loop with different stability characteristics than making the FEEDING floors depend on y (the floors do not feed back into their own input the way the main loop''s cutoff->fi.lowpass->an.zcr->y chain does). Needs real DawDreamer-level tracing (not just CI pass/fail) of the main loop''s y trajectory sample-by-sample during a transient to see whether the frequency-scaled main-tracker version is oscillating/overshooting rather than converging faster.'
  witness: CI run 31307150451 measured regression; faustlibraries filters.lib source confirming lptau reduces to plain tau2pole
