- id: octave-swap-steady-state-cause
  status: witnessed
  witness: 'effects/home/faust/multitranspose.dsp:38-46 trackPitchHz uses an.zcr (zero-crossing rate) on a lowpass-filtered signal with an adaptive cutoff -- a real, well-known octave-detection-error-prone algorithm: harmonic-rich or timbrally-shifting real input (voice, guitar, synth with moving formants) can make the zero-crossing rate lock onto the 2nd harmonic (reads an octave high) or a subharmonic (reads an octave low) as the signal''s spectral content changes, independent of the note onset transient already fixed this session. User reports this as ongoing octave-swapping as the input sound changes, not just at note attack. Needs live DawDreamer reproduction with a harmonically-rich/timbre-varying test signal (not a pure sine, which cannot trigger this failure mode) before designing a fix.'
  SESSION_ID: sess-1786300739526
  witness_evidence: 'DawDreamer reproduction: fed detectedFreq() a synthetic tone with fundamental (220Hz) amplitude fading 1.0->0.05 and 2nd harmonic (440Hz) amplitude rising 0.3->1.0 over 3 seconds (a real timbre-shift, e.g. an instrument or voice''s harmonic balance moving). Tracker holds correctly near 220-224Hz through 0-1100ms while the fundamental still dominates, then jumps abruptly to 436-442Hz between 1100-1300ms as the 2nd harmonic overtakes it in amplitude -- a full octave error -- and NEVER RECOVERS for the rest of the note even though the true 220Hz fundamental is still present in the signal (just quieter). Root cause: trackPitchHz''s an.zcr zero-crossing counter operates on fi.lowpass(N,cutoff,xHighpassed) with cutoff adaptively following the tracker''s OWN prior output y (self-referential, no ground-truth anchor) -- once the dominant zero-crossing-rate-producing component shifts to the 2nd harmonic, cutoff tracks upward with it and the tracker has no mechanism to prefer the lower/fundamental frequency once knocked off; it is a pure local-tracking algorithm with no octave-correction or fundamental-preference logic.'
- id: resonbp-subharmonic-check-too-expensive
