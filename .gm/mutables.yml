is bypassed entirely in the compiled WASM graph and the real pitch_ffi.h engine (compiled separately) does the actual pitch-shift work in JS between two Faust-compute() calls. This keeps the hardware''s dsp/aloop.dsp COMPLETELY untouched (zero risk to production) while making the browser path genuinely bit-identical since it calls the EXACT SAME pitch_ffi.h/soladSnacOctaver.h C++ source, just compiled to a second WASM module instead of linked into one.'
