  witness: 'Both attempted octave-correction mechanisms (resonbp-based: 227s, an.zcr-based: 395s) compile in seconds when trackPitchHz/detectedFreq is isolated standalone, but take minutes when compiled as part of the full 6-voice multitranspose.dsp file. Since detectedFreq is called ONCE at the top of process() and its result (freqDet) is shared into all 6 harmonySum/voiceOut calls (matching this project''s documented CSE behavior for pure-signal expressions per AGENTS.md ''Faust already CSEs par()-replicated pure-signal subexpressions''), the blowup is NOT expected under that documented sharing behavior -- needs investigation into whether the new octave-correction logic''s recursive depth or ba.if branching defeats CSE/depth-first-scheduling in a way the pre-existing simpler trackPitchHz did not, before choosing a final fix shape.'
  SESSION_ID: sess-1786300739526
  witness_evidence: 'Root cause isolated: every octave-correction variant that RECOMPUTED fi.highpass(1,20.0,x) a second time (calling it again on sig inside a new octaveCorrect() function, rather than reusing the SAME xHighpassed signal instance already computed inside trackPitchHz) triggered massive full-6-voice-file compile blowup (227s-395s+, one run never completed after 5+ minutes), despite compiling in under 1 second when trackPitchHz/detectedFreq was tested standalone/isolated. Fixed by restructuring trackPitchHz into trackPitchHzAndHp, which returns BOTH the tracked frequency AND the already-computed xHighpassed signal as a 2-wire output, piped directly into octaveCorrect via Faust''s standard multi-wire : operator -- zero re-filtering, same signal instance reused. Full-file compile time with this structure: 21.6s and 25.9s across two runs, a real and acceptable (if not negligible) increase over the unfixed baseline, vs the untenable 227-395+ second blowup from re-filtering sig a second time.'
- id: octavecorrect-floor-clamp-corrupts-low-notes
  status: witnessed
  witness: 'DawDreamer A/B: a harmonically-rich 65Hz note (fundamental+2nd+3rd harmonics) tracks correctly at 63.9Hz on the pre-octaveCorrect file (commit 01e2630), but the current file (with octaveCorrect added in fb7787e) pins it incorrectly at exactly 60.0Hz -- the minTrackHz floor value itself. Root cause: octaveCorrect''s halfY=max(minTrackHz, rawY*0.5) clamps the candidate subharmonic to the floor whenever the TRUE subharmonic would fall below minTrackHz=60 (true here: 63.9*0.5=31.95, clamped to 60). The subharmonic-consistency check then tests whether 60Hz (an arbitrary floor value, NOT the real subharmonic) is self-consistent against the signal -- since 60Hz sits close to the real fundamental''s own frequency region for a near-floor note, this spuriously passes and permanently pulls the tracker down to the floor. This is the likely mechanism behind the user''s report of octave misreads specifically on lower input notes, and is a regression introduced by the octaveCorrect fix itself, not present in the original tracker.'
