- SESSION_ID: s1788698124
  id: link-transport-no-beat-anchor
  statement: LinkBridge::setTransportPlaying calls state.setIsPlaying() but never anchors the beat timeline. Ableton's API provides setIsPlayingAndRequestBeatAtTime / requestBeatAtStartPlayingTime for exactly this 'quantized launch' case. Without it a joining peer inherits whatever free-running phase exists, which matches the reported symptom of landing mid-metronome until the remote device is stopped and restarted.
  kind: defect
  status: witnessed
  witness_evidence: Duplicate of PRD row anchor-link-beat-0-to-the-quantum-when-we-start-transport, already resolved. src/link/link_bridge.cpp:167 uses setIsPlayingAndRequestBeatAtTime. Shipped in baba1fb.
- SESSION_ID: s1788698124
  id: no-alsa-seq-on-device
  statement: The Pi has no /dev/snd/seq — snd_seq_device is loaded only as a dependency of snd_rawmidi and the sequencer device node does not exist. So MIDI clock fan-out must use snd_rawmidi with hw:CARD,DEV,SUB names discovered from /proc/asound/card*/midi*, not snd_seq ports. Right now only card 1 (APC Key 25) has a MIDI port at all; the AIR 192|4 and the UAC2 gadget expose none, so the US-2x2 and KO2 will appear as new cards when plugged and enumeration must be periodic rather than once at startup.
  kind: constraint
  status: witnessed
  witness_evidence: 'Permanent hardware constraint, not a defect -- confirmed still true and already handled: src/control/midi_clock.cpp and midi.cpp enumerate via /proc/asound/card*/midi* and snd_rawmidi hw:CARD,DEV,SUB, never snd_seq, matching AGENTS.md''s documented rule. No action needed, this is durable ground truth.'
- SESSION_ID: s1788698124
  id: midi-loop-100ms-poll-too-coarse-for-clock
  statement: midi.cpp's event loop is poll()-driven with a 100ms timeout. MIDI clock needs 24 PPQN, i.e. ~20.8ms per tick at 120bpm and ~10ms at 240bpm, so the existing loop cannot carry clock without either shortening the poll timeout (it already wakes on MIDI input, so a shorter timeout costs idle wakeups) or running clock on its own thread. Ticks must be derived from the Link beat timeline rather than a local timer, or the clock will drift away from the very sync it is meant to distribute.
  kind: constraint
  status: witnessed
  witness_evidence: src/control/midi_clock.cpp owns its own dedicated thread deriving ticks from LinkBridge::beatNow(), never the 100ms-poll midi.cpp loop. Shipped in b912515, documented in AGENTS.md's MIDI clock fan-out section.
- SESSION_ID: s1788698124
  id: link-sync-phase-jump-not-varispeed
  statement: 'Three mechanisms fight each other when Link is connected. (1) audio_thread.cpp rewrites every looper length to 4 beats at the Link tempo. (2) linkSpeedRatio = recordedBpm/linkBpm is applied as effSpeed. (3) masterPhaseSamples += delta JUMPS the read position toward the Link phase every fresh snapshot. dsp/loop.dsp advances rposNext by speedClamped per sample, so effSpeed>1 reads faster, which makes the ratio INVERTED: a 100bpm loop on a 120bpm grid needs 1.2, the code computes 0.833. And masterPhaseSamples advances by exactly N per block regardless of tempo, so it perpetually re-drifts and the jump re-fires -- the jump is a read-pointer discontinuity, i.e. the reported glitch.'
  kind: defect
  status: witnessed
  witness_evidence: 'Matches AGENTS.md''s ''Link tempo matching is VARISPEED, never a read-position jump'' section (fixed 2026-09-06): masterPhaseSamples advances at linkSpeedRatio*g_manualSpeedMul (target timeline), the phase-error correction is a bounded speed trim (kLinkPhaseTrimPerSample, clamped kLinkPhaseTrimMax=0.03) applied to effSpeed rather than a position jump, and the trim yields to manual punch (suspended while |g_manualSpeedMul-1.0|>0.3) and is gated on linkVarispeedEngaged so it cannot saturate before any take exists. Verified live per AGENTS.md: eff_speed holds 0.5000/2.0000 across punches and returns to exactly 1.0000 on release.'
