- id: pitch-tracker-high-octave-fix-needs-ci-jit-verification
  subject: 'Analytical review of multitranspose.dsp''s trackPitchHz found the same failure class as the already-documented low-frequency bug, mirrored: at a fresh HIGH-octave transient onset, the recursive cutoff state (y) and the coarse floor (coarseHz, t=0.003) both still reflect whatever came before (silence or a lower prior note) for their respective fixed-time-constant convergence windows (3ms/20ms, neither scaled by detected frequency) -- so detNote initially reads TOO LOW right after a high note''s attack, shiftAmount=targetNote-detNote reads too HIGH, and the wet output starts flat and rises (up-slides) into the target pitch as tracking catches up, matching the user''s report exactly. This reasoning is mathematically sound from the DSP formula but UNVERIFIED numerically -- no local DawDreamer/Python environment available on this Windows dev host (per AGENTS.md''s own established pattern, DawDreamer runs on a real Linux CI host, not locally). Needs a CI-run DawDreamer JIT test (test/resonode-sweetspot/''s existing harness pattern) at high octaves (880-1500Hz, near maxTrackHz) with a sharp transient onset, measuring shiftAmount/wet-output convergence over the first ~100ms, before committing to a specific fix shape (candidate: scale the coarse tracker''s convergence speed by the ALREADY-detected frequency from the previous block, similar in spirit to windowFor''s pitch-synchronous window sizing -- but this needs real measurement, not just plausible reasoning, per this project''s own repeated "compiling clean proves nothing about runtime safety" discipline).'
  status: witnessed
  witness_evidence: 'Real CI DawDreamer run (test-pitch-tracker.yml, run 31263287059, commit d85947e) with a dry-signal zero-crossing-method control (reading within +/-5 cents, confirming the measurement technique is sound) found: multitranspose.dsp''s actual output at 880/1046.5/1318.5 Hz transients reads +191 to +209 cents SHARP (mean) in the 35-100ms post-onset window, with early spikes up to 650-750 cents, converging to within ~50-70 cents by 200ms+. Direction is SHARP-then-converging-down (my original UP-SLIDE hypothesis had the wrong direction label -- the real bug is the SAME direction as the already-documented/partially-fixed low-frequency ''starts sharp, slides down'' bug, just reappearing at high octaves at a much larger magnitude than the low-frequency fix achieves elsewhere: 200+ cents mean vs the low-freq fix''s target of ''a couple of semitones by 60-100ms''). Root cause: trackPitchHz''s coarseHz/main-loop convergence lag (coarseTrackerTau=0.003, trackerTau=0.02, both fixed wall-clock time constants) still lets detNote briefly under-read a fresh high note''s true frequency, inflating shiftAmount positive, before catching up -- same mechanism as the already-fixed low-frequency case, just not adequately covering the high end of the practical range. Discharged: this mutable asked for real numbers before committing to a fix shape, and now has them -- routing to a new PRD row for the actual fix rather than re-opening this mutable.'
- id: loop-boundary-anchor-exact-semantics
  status: witnessed
  description: 'User request: ''the longer the loop is, the more it has to clip to boundaries, if we record a long loop like a phrase but pressed record start just before the phrase ended like a 16th, it''s supposed to take the phrase start as a starting point... we should only use half as a starting point if it''s shorter than a phrase.'' dsp/loop.dsp:50-56 already implements armGridSnap/armPhaseBias/recordStartPhaseOffset -- snaps the ARM instant to the nearest 1/16 grid tick of the CURRENTLY ESTABLISHED phrase (armGridLen = min(wrapLen, gridStep) once established, else gridStep alone pre-establishment). This existing mechanism only activates once wrapLenEstablished (i.e. on the 2nd+ recording after a masterLen already exists) -- apc_grid.cpp''s masterLenSamples==0 branch (the FIRST/establishing recording) has zero phrase-boundary snapping, it just takes raw writeIdx. Need to determine: (a) is the user describing a bug in the EXISTING armGridSnap grid-tick granularity for long loops (multiple established-phrase-lengths), where the current per-16th snap is too coarse and should instead snap to whole-phrase or half-phrase boundaries depending on loop length vs phrase length, or (b) a NEW anchor behavior needed on the establishing recording itself when a phrase already exists from Link/a prior now-cleared session. Needs the recorded audio''s own length compared against gridStep/wrapLen to decide the half-vs-full threshold the user names.'
  witness: dsp/loop.dsp:50-56 (armGridSnap/armPhaseBias/recordStartPhaseOffset), src/control/apc_grid.cpp:148-220 (applyRecPlayCycle)
  witness_evidence: 'Traced dsp/loop.dsp:22,26,51-54 exactly: gridStep=masterLen/16 is FIXED at a sixteenth-note width regardless of how long the actual recording take turns out to be. armGridLen=min(wrapLen,gridStep) once wrapLen is established from a PRIOR recording, but the ARM-time snap itself (armGridSnap, computed at armEdge, before the take''s own length is known) always rounds to the nearest 16th-of-masterLen tick -- never to a coarser phrase-relative boundary informed by the take''s own eventual length. The user''s fix target is real and singular: the anchor boundary chosen at FINISH time (when writeIdx/wrapLen for THIS take is finally known) needs to pick its snap granularity from the take''s own length relative to masterLen -- full phrase boundary if the take is >= one masterLen, half-phrase if 0.5*masterLen <= take < masterLen, else the existing 1/16 grid stays correct for short takes. This is a change to recordStartPhaseOffsetStep''s computation (dsp/loop.dsp:55) to use a length-adaptive armGridLen at FINISH instead of the always-1/16 one computed at ARM -- armPhaseBias must be recomputed against wrapLen (now known) at finishEdge, not reused from armEdge time.'
