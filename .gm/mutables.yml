- key: faustwasm-ffunction-support
  status: resolved
  witness: '@grame/faustwasm (the official, currently-recommended Faust-for-web toolkit) compiles DSP via FaustCompiler.ts''s createDSPFactory(), which calls fLibFaust.createDSPFactory(name, code, args, poly) -- this invokes libfaust-wasm''s OWN internal wasm codegen directly, returning a compiled WebAssembly.Module byte array with NO intermediate C++ source file exposed and no separate emcc/linking step in the pipeline. This is architecturally the same class of JIT-style single-step compile as DawDreamer''s libfaust LLVM JIT, which AGENTS.md already documents as refusing ffunction()-bound external C++ symbols entirely ("calling foreign function ''dubfx_pitch_tick'' is not allowed in this compilation mode"). The webaudio/ raw-architecture-file approach (which WOULD have supported ffunction via the same -i inlined-C++-then-real-compiler pattern the LV2 build uses) has been explicitly deprecated by Faust upstream in favor of faustwasm (architecture/webaudio/README.md: "Please use the faustwasm project for new developments"). CONCLUSION: pitch.dsp''s ffunction dependency on pitch_ffi.h/EngineSoladSnac cannot be compiled through faustwasm''s standard pipeline as-is. Two real paths forward, both requiring further work: (A) Faust''s CLI itself (not faustwasm''s JS wrapper) may still support `faust -lang cpp -i -a <webaudio-arch>.cpp dsp.dsp -o out.cpp` followed by manual emcc compilation, if a WebAudio-target architecture .cpp file still exists/works even though its own README defers to faustwasm -- needs direct verification against a real Faust CLI install, not assumed from the deprecation notice alone; (B) stub pitch.dsp''s ffunction call for the browser build specifically (matching the DawDreamer harness''s own existing workaround already used elsewhere in this codebase) and clearly document that the pitch-lock/Resonode''s exciter path is the one deliberately non-1:1 piece, with the rest of the chain (loopers, granulator via separately-ported Sampler WASM, filters/delay/reverb/bitcrush/flanger/phaser/tremolo/vinyl/compressor -- none of which use ffunction) remaining fully 1:1.'
