  note: 'Corrected: not inert in the DSP. multitranspose.dsp:35 builds the internal tracker from an.zcr(t, fi.lowpass(N, cutoff, xHighpassed)), and :142 selects it whenever extFreqDet does not apply (freqDet = ba.if(extFreqDetApplies, extFreqDetDiagRaw, freqDetInternal)). So it is live whenever the external detector is at/below minTrackHz+1. What IS true is that no test exercises it: every script in test/pitch-tracker-transient feeds the true input frequency on channel 4 because extFreqDet=0 does not converge inside the test windows (see README), so the internal zcr path has zero CI coverage. Whether the live path ever leaves extFreqDet silent, and how the zcr tracker behaves then, is still unwitnessed.'
