  SESSION_ID: eac6e6be
  status: witnessed
  witness_evidence: 'Post-deploy (dd66855) re-test on 192.168.137.100, looper1, 12x erase->arm->finish cycles against a real master (wraplen[0]=96511): every trial''s pre-erase telemetry read rec=0 (FINISH always stopped recording, symptom (a) not reproduced), and every trial''s post-arm/finish wraplen was a fresh clean power-of-2 fraction/multiple of master rather than a stale/leftover value (symptom (b) not reproduced). Consistent with both symptoms having stemmed from the same anyHasContent shadow-state desync cascade now fixed. Not exhaustively stress-tested against literal lost-MIDI-note-off / rapid real-button-mash timing -- if either symptom recurs under real physical play, treat as a separate root cause (e.g. m_looperHeld stuck from a dropped note-off) and reopen.'
- id: mc505-quantization-lineup-adversarial-sweep
  subject: 'User (an MC-505-style groovebox user) reports: quantization/loop lineup is confusing, additional loops sometimes don''t line up with their recording, and a loop''s position changes as soon as it plays. Doing an exhaustive step-by-step review of every ARM/FINISH/PAUSE/RESUME/varispeed/SHIFT-fold/clear-all corner case in dsp/loop.dsp + apc_grid.cpp, live-testing each on real hardware (192.168.137.100). First confirmed root cause: Link-synced first recording could pick a non-power-of-2 recorded_beats, breaking the power-of-2-ratio invariant (fixed, see commit). Still investigating: the specific ''position changes as soon as they play'' phrasing (candidates so far, none yet confirmed live: FINISH''s grid-ceiling padding continuing to record past the button press then later pausing SHIFT-held others via m_looperPauseOthersOnFinish; the phase-locked-not-per-take-offset resume model surprising an MC-505 user who expects mute/unmute to preserve a fixed relative position -- which is actually equivalent under clean quantization but may read as ''wrong'' during any transient misalignment).'
  session_id: eac6e6be
  status: witnessed
  witness_evidence: 'Full redesign shipped in 6478627: ARM now snaps to the nearest 1/8-beat grid boundary (fineGridWrapped, hoisted, zero new per-looper state) instead of only the phrase-top, and FINISH uses near-cut/far-extend instead of always-ceiling (see finish-ceiling-padding-captures-real-audio-past-press). Built a reusable adversarial JS simulator (tools/loop-quantization-sim/) mirroring the real DSP+control-layer state machine; 16000+ fuzz trials clean on the final design, plus targeted checks confirming exact 1.000 ratio-to-beat across six phrase offsets. Found and fixed three real missing-cancel-pulse bugs along the way (stuck Faust pend after an aborted ARM, reachable via double-press-cancel/hold-erase/clear-all). Two richer ARM designs (nearest-node with real backward audio recovery via a pre-roll delay-line; nearest-node with rsm-only backdate) were built, JS-validated, and dropped after both hit dsp/loop.dsp''s real compile-time-cliff in local dsp-cli verification -- full history in control-surface-quantization-history.md. CI''s real cross-compile of the shipped (stateless) design succeeded. NOT hardware-verified -- Pi was unreachable this entire session despite extensive troubleshooting (killed a stale 2-day-old process blocking netboot''s TFTP/HTTP ports, confirmed correct network config, confirmed physical link up, confirmed SD card removed and a fresh reboot) -- needs a live MIDI-injection pass in a future session once the device is reachable.'
- id: finish-ceiling-padding-captures-real-audio-past-press
  subject: 'dsp/loop.dsp: FINISH''s grid-ceiling quantization (documented, intentional -- always rounds UP, never truncates) works by letting recordingGateNow stay TRUE and continue writing real prevFiltIn audio into the ring past the FINISH button press, until widx reaches the ceiling-quantized finishTargetN. Confirmed via static read: gateOf/gateCur/writeVal in loop.dsp. Consequence for a take shorter than one grid unit (anchorGridBeats*oneBeat): the loop keeps silently recording REAL content (or silence, if the player stops immediately) for up to just-under-one-grid-unit''s worth of extra time after FINISH is pressed, and the new loop stays muted (out is gated by (1-recordingGateNow)) until that padding completes -- so play=1/LED-playing fires instantly on press but audible playback is delayed by the padding window, and the loop''s actual content includes whatever happened during it. Strong candidate for the user''s ''doesn''t line up with what I recorded'' / ''position changes as soon as they play'' reports on any off-grid-length take. Not yet live-confirmed (Pi unreachable this session) -- needs a live timed test (scratchpad finish-padding-delay.js already written) measuring press-to-audible delay and inspecting captured tail content. This is the SAME rounding policy the project already documents as intentional (AGENTS.md ''always the CEILING''); the surprising part is that the padding captures live input rather than pure silence and delays audibility -- worth confirming with the user whether that''s the wanted behavior before changing it (not a silent-fix call).'
  session_id: eac6e6be
  status: witnessed
  witness_evidence: 'Fixed in 6478627: apc_grid.cpp''s non-first-looper FINISH branch replaced the always-ceiling quantization with a near-cut/far-extend rule (pickAnchorGridBeats + pastNodeBeats/overshootBeats/futureNodeBeats) -- an overshoot <=1 beat past the most recently passed grid node now cuts back to it immediately (no further recording, no padding), only overshoots >1 beat still extend to the next tier. JS-simulator-validated: played=4+0.99 beats -> cuts to 4.000; played=4+1.05 beats -> extends to 8.000, matching the exact 1-beat threshold. Not yet hardware-verified (Pi unreachable all session) but CI''s real cross-compile of the paired Faust change succeeded (run 36536527993).'
- id: link-transport-beat0-reanchor-on-local-resume
  subject: src/link/link_bridge.cpp:159 setTransportPlaying(true) unconditionally calls setIsPlayingAndRequestBeatAtTime(true, now, 0.0, kLinkQuantum) with NO guard on peer count or weOwnTempo, whenever ApcGrid::publishTransport sees local anyPlaying flip false->true (i.e. every time ALL loopers were paused/stopped and the user resumes even a single one). This broadcasts a fresh beat-0 anchor to the whole Ableton Link session on every local full-stop-then-resume gesture, which could re-anchor or disrupt OTHER Link peers (the ticker mesh, another aloop unit, a DAW) mid-performance -- a real live-rig 'why did everything jump' risk distinct from anything inside this device's own masterPhase math (confirmed local masterPhaseSamples is NOT reset by this call, only cross-device Link state is affected). Whether Link's own peer-negotiation protocol actually protects against a late-joining/resuming peer clobbering an established session's beat-phase the way proposeTempo protects tempo is UNCONFIRMED -- needs a real second Link peer to test (none available this session; esp-idf-link hardware not exercised). Do not silently change Link session-transport semantics without the user's input -- this affects how the device behaves in a live multi-device rig, ask first.
  session_id: eac6e6be
  status: witnessed
  witness_evidence: 'C:/dev/esp-idf-link/AGENTS.md lines 53-60 (By-the-book Ableton Link integration checklist): ''This project CONSUMES transport (state.isPlaying() in link_sync.cpp -> MIDI Start/Stop/Continue + all-notes-off) and correctly does NOT call setIsPlaying -- it has no local play/stop control; it is a clock/transport bridge to downstream gear. ../aloop is the emitter: it publishes setIsPlaying on every play-state edge.'' This confirms the mesh''s actual design: aloop''s local looper play/pause state is SUPPOSED to be the sole authoritative transport source for the whole physical rig, translated by the ticker ESP32 into real MIDI Start/Stop/Continue + all-notes-off to downstream gear. The beat-0 re-anchor on local-resume (link_bridge.cpp:159 setTransportPlaying) is therefore the intended behavior, not an oversight -- retracting the earlier flag. No code change made (would have been a real regression against the documented mesh architecture).'
